  state.options.keepFixed   = document.getElementById('opt-keep-fixed').checked;
  state.options.keepZone    = document.getElementById('opt-keep-zone').checked;
  state.options.sepRules    = document.getElementById('opt-sep-rules').checked;
  state.options.sepGender   = document.getElementById('opt-sep-gender').checked;

function renderOffsetEditor(){
  var el = document.getElementById('offset-editor');

  for (var n = 0; n < state.groupSize; n++) {
    var v = state.groupOffsets[n] !== undefined ? state.groupOffsets[n] : 0;

      '<span style="font-size:12px; color:var(--soft)">班 (mod N)</span></div>';
  }
}
function resetOffsets(){
  state.groupOffsets = [1, 2, -1, -2, 3, -3];
  renderOffsetEditor(); save();
  showToast('オフセットを既定に戻しました');
}

function exportData(){
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'sekigae_data_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function importData(file){
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try {
      var d = JSON.parse(e.target.result);
      Object.keys(d).forEach(function(k){
        if (k === 'options' && d.options) {
          Object.keys(d.options).forEach(function(ok){
            if (ok in state.options) state.options[ok] = d.options[ok];
          });
        } else if (k in state) state[k] = d[k];
      });
      save(); renderRoster(); renderAllBoards();
      showToast('データをインポートしました');
    } catch(err){ showToast('読込失敗', 'error'); }
  };
  rd.readAsText(file);
}
function resetAll(){
  if (!confirm('全データをリセットします。よろしいですか？')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

// =================================================================
// PRINT
// =================================================================
function printSeating(){
  // Decide what to print: prefer proposed if non-empty, else current
  var seating = (state.proposed && state.proposed.some(function(x){ return !!x; })) ? state.proposed
              : (state.current  && state.current .some(function(x){ return !!x; })) ? state.current
              : null;
  if (!seating) { showToast('印刷できる席がありません', 'error'); return; }
  var area = document.getElementById('print-area');
  var dateStr = new Date().toLocaleString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
  var title = (state.proposed && state.proposed.some(function(x){ return !!x; })) ? '新しい席順' : '現在の席順';
  var html = '<h1>' + title + '</h1>' +
             '<div class="print-meta">' + dateStr + '</div>';
  // Blackboard rendering (top by default for print)
  var bbTop = (state.boardSide === 'top'  || state.boardSide === 'left' || !state.boardSide);
  var bbBottom = (state.boardSide === 'bottom');
  if (bbTop) html += '<div class="print-blackboard">黒板</div>';
  html += '<div class="print-grid" style="grid-template-columns:repeat(' + state.cols + ',1fr); grid-template-rows:repeat(' + state.rows + ',1fr)">';
  var total = state.rows * state.cols;
  for (var i = 0; i < total; i++) {
    var sid = seating[i];
    var s = sid ? findStudent(sid) : null;
    var isD = state.disabled.indexOf(i) !== -1;
    var cls = 'print-seat' + (isD ? ' disabled' : (s ? '' : ' empty'));
    var inner = '';
    if (isD) inner = '✕';
    else if (s) {
      var c = (s.gender === 'male') ? '#1a4a78' : (s.gender === 'female') ? '#9a2848' : '#000';
      inner = '<span style="color:' + c + '">' + s.name + '</span>';
    } else {
      inner = (i + 1);
    }
    html += '<div class="' + cls + '">' + inner + '</div>';
  }
  html += '</div>';
  if (bbBottom) html += '<div class="print-blackboard">黒板</div>';
  area.innerHTML = html;
  setTimeout(function(){ window.print(); }, 50);
}

// =================================================================
// HEADER ACTIONS
// =================================================================
function toggleOrient(){
  state.boardOrient = (state.boardOrient === 'vertical') ? 'horizontal' : 'vertical';
  applyOrient();
  save();
}
function applyOrient(){
  document.getElementById('dual-board').dataset.orient = state.boardOrient;
  document.getElementById('divider').textContent = 'ドラッグして机を動かそう';
}

function setBoardSide(side){
  state.boardSide = side;
  applyBoardSide();
  save();
}
function applyBoardSide(){
  ['board-current','board-proposed','layout-board'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.dataset.side = state.boardSide;
  });
  document.querySelectorAll('#bb-side-sel button').forEach(function(b){
    b.classList.toggle('active', b.dataset.side === state.boardSide);
  });
}

// =================================================================
// INIT
// =================================================================
function bindEvents(){
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
  });
  document.getElementById('orient-toggle').addEventListener('click', toggleOrient);
  document.getElementById('rows').addEventListener('input', onLayoutChange);
  document.getElementById('cols').addEventListener('input', onLayoutChange);
  // Blackboard side selector
  document.querySelectorAll('#bb-side-sel button').forEach(function(b){
    b.addEventListener('click', function(){ setBoardSide(b.dataset.side); });
  });
  // Display settings
  var themeSel = document.getElementById('opt-theme');
  if (themeSel) {
    themeSel.innerHTML = Object.keys(THEMES).map(function(k){ return '<option value="' + k + '">' + THEMES[k].label + '</option>'; }).join('');
    themeSel.value = state.options.theme || 'soft';
    themeSel.addEventListener('change', function(){
      state.options.theme = themeSel.value;
      applyTheme(state.options.theme); save();
    });
  }
  var fontSel = document.getElementById('opt-font');
  if (fontSel) {
    fontSel.value = state.options.font || "'Noto Sans JP', sans-serif";
    fontSel.addEventListener('change', function(){
      state.options.font = fontSel.value;
      applyFont(state.options.font); save();
    });
  }
  // Font size sliders (initial setup tab + seating panel) — kept in sync
  ['opt-fontsize','opt-fontsize-2'].forEach(function(id){
    var sl = document.getElementById(id); if (!sl) return;
    var lab = document.getElementById(id + '-val');
    sl.value = state.options.fontSize || 100;
    if (lab) lab.textContent = (state.options.fontSize || 100) + '%';
    sl.addEventListener('input', function(){
      var v = parseInt(sl.value) || 100;
      setFontSize(v);
    });
  });
  // Excel zone wiring
  var zone = document.getElementById('excel-zone');
  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.style.borderColor = 'var(--purple)'; });
  zone.addEventListener('dragleave', function(){ zone.style.borderColor = ''; });
  zone.addEventListener('drop', function(e){ e.preventDefault(); zone.style.borderColor = ''; var f = e.dataTransfer.files[0]; if (f) handleExcelFile(f); });
  document.getElementById('excel-file').addEventListener('change', function(e){ if (e.target.files[0]) handleExcelFile(e.target.files[0]); });
}

function init(){
  load();
  // Migrate / sanitize loaded state
  if (['disable','zonem','zonef','fix'].indexOf(state.editMode) === -1) state.editMode = 'disable';
  // Apply loaded UI states
  document.getElementById('rows').value = state.rows;
  document.getElementById('cols').value = state.cols;
  applyOrient();
  applyBoardSide();
  applyTheme(state.options.theme || 'melon');
  applyFont(state.options.font || "'Noto Sans JP', sans-serif");
  applyFontSize(state.options.fontSize || 100);
  if (!state.groupLayout || !state.groupLayout.length) autoLayoutGroups();
  bindEvents();
  renderRoster();
  renderAllBoards();
  switchTab('roster');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
