<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;700&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#f5efe0; --bg2:#f0e6ec; --bg3:#e6eef5; --bg4:#ebf0e8;
  --pink:#d99fb1; --blue:#8ab1cc; --yellow:#e8d28c; --green:#a8c3a3; --purple:#a89dc4; --orange:#d9b58a;
  --ink:#3a4762; --soft:#7c8499; --line:#cbd2dc;
}
html,body{height:100%}
body{
  font-family:'Noto Sans JP', 'Kosugi Maru', sans-serif;
  font-size:14px;
  color:var(--ink);
  background:var(--bg-grad, linear-gradient(160deg,#fdfbf6 0%,#f5f3ec 50%,#eef2f6 100%));
  min-height:100vh; overflow-x:hidden;
}
/* (decorations removed for calmer tone) */

/* Header */
.app-header{
  position:relative; z-index:5;
  padding:16px 20px;
  background:linear-gradient(95deg,#cdd9e3 0%,#dcd1d9 50%,#d4dcc9 100%);
  color:var(--ink); box-shadow:0 2px 8px rgba(58,71,98,.08);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  flex-wrap:wrap;
}
.app-header h1{
  font-weight:700; font-size:20px;
  letter-spacing:.5px;
}
.app-header h1 .sub{font-size:12px; font-weight:400; opacity:.7; margin-left:6px}
.header-tools{display:flex; gap:8px}
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line);
  background:#fff; color:var(--ink); font-size:18px; cursor:pointer;
  box-shadow:0 2px 4px rgba(58,71,98,.1); transition:all .15s;
}
.icon-btn:hover{transform:translateY(-1px); border-color:var(--purple)}
.icon-btn:active{transform:translateY(1px)}

/* Tabs */
.tabs{
  position:sticky; top:0; z-index:50;
  display:flex; gap:6px; padding:10px 14px;
  background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1; max-width:220px; padding:9px 8px;
  border:1.5px solid var(--line); border-radius:10px;
  background:#fff; color:var(--soft); font-family:inherit; font-weight:600; font-size:14px;
  cursor:pointer; transition:all .15s;
}
.tab:hover{border-color:var(--purple); color:var(--ink)}
.tab.active{background:var(--purple); color:#fff; border-color:var(--purple)}

.content{position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:14px}
.panel{display:none; flex-direction:column; gap:14px}
.panel.active{display:flex}

.card{
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px;
  box-shadow:0 1px 3px rgba(58,71,98,.06), 0 4px 12px rgba(58,71,98,.04);
  position:relative;
}
.card h2{font-size:15px; font-weight:700; margin-bottom:14px; display:flex; gap:6px; align-items:center}
.card h2 .badge-num{font-size:11px; padding:2px 8px; background:var(--yellow); color:var(--ink); border-radius:99px; font-weight:700}

/* Buttons */
.btn{
  padding:7px 14px; border:1.5px solid var(--line); border-radius:8px;
  background:#fff; color:var(--ink); font-family:inherit; font-weight:600; font-size:13px;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn:hover{border-color:var(--purple); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--purple); color:#fff; border-color:var(--purple)}
.btn-primary:hover{background:#8d80b3; border-color:#8d80b3}
.btn-pink{background:var(--pink); color:#fff; border-color:var(--pink)}
.btn-green{background:var(--green); color:#fff; border-color:var(--green)}
.btn-ghost{background:#f7f6f1}
.btn-danger{background:#fff; color:#b04848; border-color:#e8c4c4}
.btn-danger:hover{background:#fbeded}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
input[type=text],input[type=number],select,textarea{
  font-family:inherit; font-size:14px; padding:7px 10px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff;
  outline:none; transition:border-color .15s;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--purple); box-shadow:0 0 0 3px rgba(168,157,196,.2)}

/* Manual / auto mode visibility */
#panel-seating[data-mode="manual"] .auto-only{display:none}
#panel-seating[data-mode="auto"] .manual-only{display:none}

/* Font size bar in seating panel */
.font-bar{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; border:1px solid var(--line); border-radius:10px;
  background:#fff;
}
.font-step{
  width:32px; height:32px; border:1px solid var(--line); border-radius:8px;
  background:#fff; cursor:pointer; font-family:inherit; font-weight:700; font-size:13px;
  color:var(--ink);
}
.font-step:hover{border-color:var(--purple)}

/* Roster import tabs */
.import-tabs{display:flex; gap:4px; margin-bottom:12px; padding:3px; background:#f0eee7; border-radius:10px}
.import-tabs button{
  flex:1; padding:8px; border:none; border-radius:7px;
  background:transparent; cursor:pointer; font-family:inherit; font-weight:600; font-size:13px; color:var(--soft);
  transition:all .15s;
}
.import-tabs button.active{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(58,71,98,.08)}
.import-body{padding:4px 0}

.tag-area{display:flex; flex-wrap:wrap; gap:5px; max-height:240px; overflow-y:auto; padding:4px}
.tag{
  display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 6px;
  border:1px solid var(--line); border-radius:99px; font-size:13px; font-weight:600;
  background:#fff;
}
.tag.male{background:#cfe1f2; border-color:#9cc0db}
.tag.female{background:#f2cdd9; border-color:#dfa0b6}
.tag .avatar{font-size:16px}
.tag-x{border:none; background:none; color:#b04848; font-size:16px; cursor:pointer; line-height:1; opacity:.6}
.tag-x:hover{opacity:1}
.gender-sel{border:none !important; background:transparent !important; box-shadow:none !important; padding:0; font-weight:700; cursor:pointer}

/* Action bar (shuffle buttons) */
.action-bar{
  display:flex; gap:8px; flex-wrap:wrap;
  padding:12px; border:1px solid var(--line); border-radius:12px;
  background:#fff;
}
.big-btn{
  flex:1; min-width:160px; padding:12px 14px; font-size:14px; font-weight:700;
  border:1.5px solid var(--line); border-radius:10px; cursor:pointer; font-family:inherit;
  background:#fff; color:var(--ink);
  transition:all .15s;
  position:relative;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.big-btn.full   {background:#ede6ec; border-color:#dec8d8; color:#5d3f50}
.big-btn.cross  {background:#e6ede6; border-color:#c8d8c8; color:#3f5d3f}
.big-btn.rotate {background:#e6e8ed; border-color:#c8cdd8; color:#3f4456}
.big-btn.confirm{background:var(--purple); border-color:var(--purple); color:#fff; font-size:15px}
.big-btn.confirm:hover:not(:disabled){background:#8d80b3; border-color:#8d80b3}
.big-btn.ghost  {background:#fff}
.big-btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 3px 8px rgba(58,71,98,.1)}
.big-btn:active:not(:disabled){transform:translateY(0)}
.big-btn:disabled{opacity:.4; cursor:not-allowed}

.dir-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line);
  background:#fff; color:var(--ink); font-size:15px; cursor:pointer;
}

/* Dual board */
.dual-board{
  display:grid; gap:14px;
  padding:14px; border:1px solid var(--line); border-radius:14px;
  background:#fafaf6;
}
.dual-board[data-orient="vertical"]{grid-template-rows:1fr auto 1fr; grid-template-columns:1fr}
.dual-board[data-orient="horizontal"]{grid-template-columns:1fr auto 1fr; grid-template-rows:auto}
.board{
  position:relative;
  border:1px solid var(--line); border-radius:12px;
  padding:14px 12px 12px; background:#fff;
  display:flex; gap:8px; min-height:240px;
}
.board[data-side="top"]{flex-direction:column}
.board[data-side="bottom"]{flex-direction:column-reverse}
.board[data-side="left"]{flex-direction:row}
.board[data-side="right"]{flex-direction:row-reverse}
.board.target-hi{ box-shadow:0 0 0 3px rgba(168,157,196,.4); border-color:var(--purple) }
.board--proposed{background:#fafdfa}
.board-label{
  position:absolute; top:-10px; left:14px;
  background:#fff; color:var(--ink); padding:2px 10px;
  border:1px solid var(--line); border-radius:99px; font-weight:700; font-size:12px;
}
.board--proposed .board-label{color:#3f5d3f}
.blackboard{
  align-self:center; padding:5px 24px;
  background:linear-gradient(180deg,#3a4a3a,#2a3a2a); color:#f3eed5;
  border-radius:4px; font-size:11px; letter-spacing:2px; font-weight:600;
  border-bottom:3px solid #8a6a4a;
}
.board[data-side="left"] .blackboard,
.board[data-side="right"] .blackboard{
  writing-mode:vertical-rl; text-orientation:mixed; padding:24px 5px;
  align-self:stretch; flex-shrink:0;
}
.divider{
  text-align:center; padding:8px; font-weight:600; color:var(--soft);
  font-size:13px; letter-spacing:1px;
  background:#fff; border:1px dashed var(--line); border-radius:10px;
}
.divider-action{
  display:flex; align-items:center; justify-content:center; padding:4px 8px;
}
.divider-action .big-btn{ font-size:18px; padding:14px 24px; min-width:240px }
.dual-board[data-orient="horizontal"] .divider{
  writing-mode:vertical-rl; text-orientation:mixed; padding:10px 6px;
}
/* 横（左右）2分割のとき：全シャッフルボタンを縦長に */
.dual-board[data-orient="horizontal"] .dual-divider{
  display:flex; align-items:stretch; align-self:stretch;
}
.dual-board[data-orient="horizontal"] .divider-action{
  display:flex; padding:8px 4px;
}
.dual-board[data-orient="horizontal"] .divider-action .big-btn{
  writing-mode:vertical-rl; text-orientation:mixed;
  min-width:0; min-height:200px; padding:24px 14px;
  letter-spacing:2px;
  align-self:stretch;
}
.seat-grid{
  flex:1; display:grid; gap:6px; padding:4px; min-height:120px;
  align-content:start;  /* rows stay natural size, no stretching to fill */
  grid-auto-rows:auto;
}

/* Blackboard side selector */
.bb-side-sel{
  display:inline-flex; gap:2px; padding:3px; background:#f0eee7; border-radius:8px;
}
.bb-side-sel button{
  border:none; background:transparent; width:28px; height:28px; border-radius:6px;
  font-family:inherit; font-size:14px; font-weight:700; color:var(--soft); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.bb-side-sel button.active{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(58,71,98,.08)}

/* Combined settings row */
.settings-row{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
.settings-row > label{display:inline-flex; align-items:center; gap:4px; font-size:13px}

.seat{
  position:relative;
  border:1.5px solid var(--line); border-radius:10px;
  background:#fff;
  min-height:calc(60px * var(--fs, 1));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:calc(13px * var(--fs, 1)); font-weight:600; cursor:grab; user-select:none;
  box-shadow:0 1px 2px rgba(58,71,98,.05);
  padding:calc(4px * var(--fs, 1)) calc(2px * var(--fs, 1));
  transition:min-height .15s, font-size .15s, padding .15s, transform .15s, box-shadow .15s, border-color .15s;
}
.seat:hover{transform:translateY(-1px); border-color:var(--purple); box-shadow:0 2px 6px rgba(168,157,196,.18)}
.seat:active{cursor:grabbing}
.seat.dragging{opacity:.35; transform:scale(.95)}
.seat.empty{
  background:#fbfaf6;
  border-style:dashed; cursor:default; box-shadow:none;
}
.seat.empty:hover{transform:none; border-color:var(--line); box-shadow:none}
.seat.empty .empty-mark{font-size:calc(18px * var(--fs, 1)); color:#cbd2dc}
.seat.disabled{
  background:#f0eee7; border-style:dotted; cursor:default;
  opacity:.55;
}
.seat.drop-hi{box-shadow:0 0 0 3px rgba(168,157,196,.4); border-color:var(--purple); background:#f6f3fb}
.seat.cbm{background:#eef4f9}
.seat.cbf{background:#f7eef2}
.seat.gend-male{background:#cfe1f2; border-color:#9cc0db}
.seat.gend-female{background:#f2cdd9; border-color:#dfa0b6}
.seat .avatar{font-size:calc(20px * var(--fs, 1)); line-height:1; margin-bottom:2px}
.seat .nm{font-size:calc(13px * var(--fs, 1)); line-height:1.2; text-align:center; word-break:break-all; max-width:100%}
.seat .gb{
  position:absolute; top:-7px; right:-4px;
  font-size:calc(10px * var(--fs, 1)); font-weight:700; padding:1px 6px; border-radius:99px;
  background:var(--purple); color:#fff;
}
.seat .gn{
  position:absolute; bottom:-7px; left:-4px;
  font-size:calc(9px * var(--fs, 1)); font-weight:700; padding:1px 5px; border-radius:99px;
  background:#fff; color:var(--ink); border:1px solid var(--line);
}
.seat .pin{position:absolute; top:2px; right:3px; font-size:calc(11px * var(--fs, 1))}
.seat .zoneM, .seat .zoneF{position:absolute; top:2px; left:3px; font-size:calc(10px * var(--fs, 1)); font-weight:700}
.seat .zoneM{color:#5d7da8}
.seat .zoneF{color:#a85d7d}
.seat .seat-num{position:absolute; bottom:1px; right:3px; font-size:calc(9px * var(--fs, 1)); color:var(--soft)}
.seat.editing{cursor:text}
.seat .inline-name-edit{
  width:90%; font-family:inherit; font-size:calc(13px * var(--fs, 1)); font-weight:600;
  text-align:center; padding:2px 4px;
  border:1.5px solid var(--purple); border-radius:6px; background:#fff; outline:none;
  color:var(--ink);
}

/* Confirm bar */
.confirm-bar{display:flex; gap:10px; flex-wrap:wrap}

/* Settings drawer */
.drawer-bg{
  display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:300;
  backdrop-filter:blur(2px);
}
.drawer-bg.show{display:block}
.drawer{
  position:fixed; top:0; right:-460px; width:min(440px,100vw); height:100%;
  background:#fff; border-left:5px solid var(--ink);
  box-shadow:-12px 0 30px rgba(0,0,0,.15);
  transition:right .25s ease; z-index:310; overflow-y:auto;
  padding:18px 16px 80px;
}
.drawer.show{right:0}
.drawer h2{font-size:18px; font-weight:900; margin-bottom:6px}
.drawer h3{font-size:14px; font-weight:900; margin:14px 0 6px; color:var(--purple)}
.drawer-section{padding:10px; border:2.5px solid var(--ink); border-radius:12px; margin-bottom:10px; background:#fffdf6}
.drawer-close{position:absolute; right:12px; top:12px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0}
.row label{font-size:13px; font-weight:700}
.toggle{display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; font-weight:700}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--purple); cursor:pointer}

/* Toast */
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  padding:10px 22px; border-radius:99px;
  background:var(--green); color:#fff; font-weight:900; z-index:9999;
  border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink);
  animation:toastIn .25s ease;
}
.toast.error{background:#ff6b6b}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-12px); opacity:0}to{transform:translateX(-50%) translateY(0); opacity:1}}

/* History */
.history-card{
  background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px;
  box-shadow:0 1px 3px rgba(58,71,98,.06); margin-bottom:10px;
}
.export-menu-wrap{position:relative}
.export-menu{
  position:absolute; right:0; top:calc(100% + 4px); z-index:60;
  background:#fff; border:1px solid var(--line); border-radius:10px;
  box-shadow:0 4px 12px rgba(58,71,98,.12);
  display:flex; flex-direction:column; min-width:120px; overflow:hidden;
}
.export-menu button{
  border:none; background:transparent; padding:9px 14px; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:13px; color:var(--ink);
  text-align:left;
}
.export-menu button:hover{background:#f3f0f9}
.history-grid{display:grid; gap:3px}
.history-grid .seat{min-height:30px; border-width:2px; box-shadow:0 2px 0 var(--ink)}
.history-grid .seat .nm{font-size:9px}
.history-grid .seat .avatar{font-size:14px}

/* Animations */
@keyframes seatSpin{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}50%{transform:rotate(7deg) scale(.95)}75%{transform:rotate(-5deg)}}
@keyframes seatFlyIn{0%{transform:translateY(-40px) scale(.6) rotate(-15deg); opacity:0}60%{transform:translateY(6px) scale(1.1) rotate(3deg); opacity:1}100%{transform:translateY(0) scale(1) rotate(0); opacity:1}}
@keyframes seatPop{0%{transform:scale(.7); opacity:0}60%{transform:scale(1.1); opacity:1}100%{transform:scale(1); opacity:1}}
@keyframes confettiFall{from{transform:translateY(-20px) rotate(0); opacity:1}to{transform:translateY(110vh) rotate(720deg); opacity:.2}}
@keyframes drumRoll{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes gachaShake{0%,100%{transform:translate(-50%,-50%) rotate(-5deg)}50%{transform:translate(-50%,-50%) rotate(5deg)}}
@keyframes ballSpin{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
@keyframes arrowDash{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes carousel{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fly-in{animation:seatFlyIn .45s cubic-bezier(.22,1,.36,1) both}
.pop-in{animation:seatPop .35s cubic-bezier(.22,1,.36,1) both}

.confetti-piece{position:fixed; top:-20px; width:11px; height:11px; border-radius:2px; z-index:9998; pointer-events:none; animation:confettiFall linear forwards}

/* Animation overlay */
#anim-overlay{
  display:none; position:fixed; inset:0; z-index:400;
  background:radial-gradient(circle at center, rgba(35,49,79,.55), rgba(35,49,79,.85));
  backdrop-filter:blur(3px);
  align-items:center; justify-content:center; flex-direction:column; gap:18px;
}
#anim-overlay.show{display:flex}
#anim-title{
  font-size:32px; font-weight:900; color:#fff;
  text-shadow:3px 3px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.2);
  animation:drumRoll .35s ease infinite;
  letter-spacing:1px;
}
#anim-skip{
  position:absolute; bottom:24px; right:24px; padding:8px 16px;
  background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:14px;
  font-weight:900; cursor:pointer; box-shadow:0 4px 0 var(--ink);
}

/* Gachapon */
.gachapon-stage{
  position:relative; width:280px; height:280px;
}
.gachapon-body{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 5%, #ffd6e7 30%, #ff77a8 75%);
  border:6px solid var(--ink);
  box-shadow:0 8px 0 var(--ink), inset 0 -20px 30px rgba(0,0,0,.15);
  animation:gachaShake .12s linear infinite;
}
.gachapon-base{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:240px; height:60px; border-radius:14px;
  background:linear-gradient(180deg,#ffd83d,#ff9f43); border:6px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);
}
.gachapon-orb{
  position:absolute; width:32px; height:32px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff, #4ea5ff 70%);
  border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  animation:ballSpin 1.2s linear infinite;
}
.fly-clone{
  position:fixed; z-index:401; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:3px solid var(--ink); border-radius:12px;
  box-shadow:0 4px 0 var(--ink); background:#fff;
  font-weight:700; padding:6px;
  transition:transform .85s cubic-bezier(.65,0,.35,1), opacity .3s;
}

/* Group settings popover */
.group-pop{
  position:absolute; z-index:60; background:#fff; padding:10px;
  border:3px solid var(--ink); border-radius:12px; box-shadow:0 6px 0 var(--ink);
  display:flex; gap:6px; flex-wrap:wrap; align-items:center; max-width:280px;
}

/* Mode chip */
.mode-row{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:5px 12px; border:2.5px solid var(--ink); border-radius:99px;
  background:#fff; cursor:pointer; font-family:inherit; font-weight:700; font-size:12px;
  box-shadow:0 3px 0 var(--ink);
}
.chip.active{background:linear-gradient(135deg,#ffd83d,#ff9f43)}

/* Print: A4 横向き、ページいっぱい */
@page { size: A4 landscape; margin: 8mm; }
@media print {
  html,body{height:auto !important; width:auto !important; margin:0 !important; padding:0 !important}
  body{background:#fff !important; color:#000}
  body > *:not(#print-area){display:none !important}
  #print-area{
    display:flex !important; flex-direction:column;
    width:100%; min-height:100vh; padding:0; margin:0;
    box-sizing:border-box;
  }
  #print-area h1{font-size:20pt; font-weight:700; margin:0 0 2mm; text-align:center}
  #print-area .print-meta{font-size:10pt; color:#444; text-align:center; margin-bottom:4mm}
  #print-area .print-blackboard{
    text-align:center; border:1px solid #444; padding:2mm 4mm; margin:0 auto 4mm;
    min-width:80mm; font-size:11pt; letter-spacing:3pt;
    background:#222; color:#fff8d2; border-radius:1mm;
  }
  #print-area .print-grid{
    display:grid; gap:2mm; flex:1; width:100%;
  }
  #print-area .print-seat{
    border:1.2pt solid #555; border-radius:2mm; padding:2mm 1mm;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:14pt; font-weight:700; word-break:break-all; line-height:1.2;
    background:#fff;
  }
  #print-area .print-seat.disabled{background:#eee; color:#aaa; border-style:dotted}
  #print-area .print-seat.empty{border-style:dashed; color:#ccc}
}
#print-area{display:none}

@media (max-width:640px){
  .dual-board[data-orient="horizontal"]{grid-template-columns:1fr; grid-template-rows:1fr auto 1fr}
  .dual-board[data-orient="horizontal"] .divider{writing-mode:horizontal-tb}
  .seat{min-height:calc(54px * var(--fs, 1))}
  .seat .avatar{font-size:calc(18px * var(--fs, 1))}
  .seat .nm{font-size:calc(11px * var(--fs, 1))}
  .app-header h1{font-size:18px}
  .big-btn{min-width:120px; padding:12px 10px; font-size:13px}
}
</style>

<body>

<header class="app-header">
  <h1>席替えアプリ <span class="sub">classroom seating</span></h1>
  <div class="header-tools"></div>
</header>

<nav class="tabs">

  <button class="tab"        data-tab="auto">🎲 自動席替え</button>

<div class="content">

  <!-- ============ ROSTER PANEL ============ -->

        <div class="row" style="margin-top:8px">
          <label class="toggle"><input type="checkbox" id="paste-replace"> 既存を上書き</label>
          <div style="flex:1"></div>

          <button class="btn btn-primary" onclick="importFromPaste()">確認して読込</button>

      <div id="imp-body-gsheet" class="import-body" style="display:none">

      <div id="imp-body-excel" class="import-body" style="display:none">

          <option value="'BIZ UDPGothic', sans-serif">読みやすさ重視</option>

          <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック</option>

  <!-- ============ SEATING PANEL (shared by manual & auto) ============ -->

    <div class="font-bar">

        <div class="seat-grid" id="grid-current"></div>
      </div>
      <div class="dual-divider">
        <div class="divider manual-only" id="divider">ドラッグして机を動かそう</div>

<script>
// =================================================================
// STATE
// =================================================================
var LS_KEY = 'seating_app_v4_new';

var state = {
  students: [],
  rows: 4, cols: 4,
  disabled: [],
  zoneM: [], zoneF: [],
  fixed: {},          // {seatIdx: studentId}
  sepRules: [],       // {id, s1id, s2id, dist} → 離す
  compRules: [],      // {id, s1id, s2id, dist} → 近づける
  current: null,      // [studentId|null] length = rows*cols
  proposed: null,     // [studentId|null] length = rows*cols
  history: [],
  // (legacy: group concept retained for old data, but no UI)
  groupSize: 4,
  groupLayout: [],
  // UI
  boardOrient: 'vertical',
  boardSide: 'top',   // top | bottom | left | right - blackboard position
  editMode: 'disable',
  selectedSeat: null,
  // Settings
  options: {
    keepFixed: true, keepZone: true, sepRules: true, compRules: true, sepGender: false,
    maxTry: 500,
    animSpeed: 'normal', sound: true, confetti: true, showMovement: true,
    theme: 'melon',
    font: "'BIZ UDPGothic', sans-serif",
    fontSize: 100
  }
};

// ===== Themes =====
var THEMES = {
  soft:    { label:'パステル（標準）', purple:'#a89dc4', blue:'#8ab1cc', pink:'#d99fb1', green:'#a8c3a3', yellow:'#e8d28c', orange:'#d9b58a', ink:'#3a4762', soft:'#7c8499', line:'#cbd2dc', bg:'linear-gradient(160deg,#fdfbf6 0%,#f5f3ec 50%,#eef2f6 100%)' },
  mono:    { label:'モノクロ',         purple:'#555', blue:'#777', pink:'#999', green:'#888', yellow:'#bbb', orange:'#aaa', ink:'#222', soft:'#666', line:'#ddd', bg:'#fafafa' },
  sakura:  { label:'桜（春）',         purple:'#c8919b', blue:'#d8a8b8', pink:'#e8b8c0', green:'#bcc8a4', yellow:'#e8d8a0', orange:'#d8a890', ink:'#5a3a44', soft:'#8a6a74', line:'#e6d3da', bg:'linear-gradient(160deg,#fff5f7 0%,#fdf0e8 100%)' },
  ocean:   { label:'海',               purple:'#5d97b8', blue:'#7da8c4', pink:'#a8d0d4', green:'#9bc4b8', yellow:'#dcd0a0', orange:'#c4a890', ink:'#2a4456', soft:'#5a7488', line:'#cbdce4', bg:'linear-gradient(160deg,#f0f8fc 0%,#e8f4f8 100%)' },
  forest:  { label:'森',               purple:'#7a9a76', blue:'#8aaa90', pink:'#d8b8a4', green:'#a3c298', yellow:'#d8c890', orange:'#c4a474', ink:'#3a4a36', soft:'#647462', line:'#d0d8c8', bg:'linear-gradient(160deg,#f4f8f0 0%,#eef4e8 100%)' },
  dawn:    { label:'朝焼け',           purple:'#d4a474', blue:'#e0b884', pink:'#e8b8a0', green:'#c8c894', yellow:'#e8d098', orange:'#d8a884', ink:'#5a4836', soft:'#88705a', line:'#e8d8c4', bg:'linear-gradient(160deg,#fff8ec 0%,#fdf0d8 100%)' },
  night:   { label:'夜（紺）',         purple:'#6a7090', blue:'#7a85a8', pink:'#9094b4', green:'#8898a8', yellow:'#b0a890', orange:'#9c8a78', ink:'#2a3050', soft:'#5a6080', line:'#c0c4d4', bg:'linear-gradient(160deg,#eef0f4 0%,#dde0ec 100%)' },
  sepia:   { label:'セピア',           purple:'#a08868', blue:'#b09878', pink:'#c8a890', green:'#b0a880', yellow:'#c8b894', orange:'#b09878', ink:'#4a3e30', soft:'#7a6850', line:'#dac8b0', bg:'linear-gradient(160deg,#f7efe2 0%,#f2e8d4 100%)' },
  melon:   { label:'メロン',           purple:'#9bc474', blue:'#a8c890', pink:'#c8d8a0', green:'#bcd998', yellow:'#dce8a8', orange:'#d0c894', ink:'#3a4828', soft:'#647050', line:'#d4e0bc', bg:'linear-gradient(160deg,#f0f8e8 0%,#e8f4d8 100%)' },
  plum:    { label:'プラム',           purple:'#9a7a96', blue:'#aa8aa8', pink:'#c898c0', green:'#a8a8a0', yellow:'#c8b8a8', orange:'#b88898', ink:'#4a3a48', soft:'#705a70', line:'#d8c8d4', bg:'linear-gradient(160deg,#f6f0f5 0%,#ede0eb 100%)' }
};

function applyTheme(name){
  var t = THEMES[name] || THEMES.melon;
  var s = document.documentElement.style;
  ['purple','blue','pink','green','yellow','orange','ink','soft','line'].forEach(function(k){
    s.setProperty('--' + k, t[k]);
  });
  s.setProperty('--bg-grad', t.bg);
}
function applyFont(font){
  document.body.style.fontFamily = font || "'Noto Sans JP', sans-serif";
}
function applyFontSize(pct){
  var p = pct || 100;
  // "Current 100% means new 80%": shift the scale base so 100 → 1.25, 80 → 1.0, 250 → 3.125
  var fs = p / 80;
  document.documentElement.style.setProperty('--fs', fs.toFixed(3));
  // Body font-size scales similarly (14px baseline at fs=1.0)
  document.body.style.fontSize = (14 * fs).toFixed(1) + 'px';
}
// Set + sync all sliders + persist
function setFontSize(pct){
  var v = clamp(parseInt(pct) || 100, 80, 250);
  state.options.fontSize = v;
  applyFontSize(v);
  ['opt-fontsize','opt-fontsize-2'].forEach(function(id){
    var sl = document.getElementById(id);
    if (sl && parseInt(sl.value) !== v) sl.value = v;
    var lab = document.getElementById(id + '-val');
    if (lab) lab.textContent = v + '%';
  });
  save();
}
function bumpFontSize(delta){ setFontSize((state.options.fontSize || 100) + delta); }

var pendingImport = null;
var animSkipFlag = false;
var animTimers = [];

// =================================================================
// UTILS
// =================================================================
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function shuffle(arr){
  for (var i=arr.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function showToast(msg, type){
  var ex = document.querySelector('.toast'); if (ex) ex.remove();
  var el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2800);
}
function findStudent(id){ return state.students.find(function(s){ return s.id === id; }) || null; }
// Card background by gender. Returns class suffix.
function genderCardClass(g){
  if (g === 'male')   return 'gend-male';
  if (g === 'female') return 'gend-female';
  return '';
}
// Kept for backward compatibility but now returns inherit (we color the card, not text)
function genderColor(g){ return 'inherit'; }

// =================================================================
// STORAGE
// =================================================================
function save(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch(e){}
}
function load(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    Object.keys(d).forEach(function(k){
      if (k === 'options' && d.options) {
        Object.keys(d.options).forEach(function(ok){
          if (ok in state.options) state.options[ok] = d.options[ok];
        });
      } else if (k in state) {
        state[k] = d[k];
      }
    });
  } catch(e){}
}

function onLayoutChange(){
  var r = parseInt(document.getElementById('rows').value) || 5;
  var c = parseInt(document.getElementById('cols').value) || 6;
  state.rows = clamp(r,1,12); state.cols = clamp(c,1,12);
  document.getElementById('rows').value = state.rows;
  document.getElementById('cols').value = state.cols;
  var total = state.rows * state.cols;
  state.disabled = state.disabled.filter(function(i){ return i < total; });
  state.zoneM    = state.zoneM   .filter(function(i){ return i < total; });
  state.zoneF    = state.zoneF   .filter(function(i){ return i < total; });
  Object.keys(state.fixed).forEach(function(k){ if (parseInt(k) >= total) delete state.fixed[k]; });
  if (state.current)  state.current  = resizeSeating(state.current , total);
  if (state.proposed) state.proposed = resizeSeating(state.proposed, total);
  autoLayoutGroups();
  save(); renderLayoutGrid(); renderAllBoards(); updateSeatStats();
}
function resizeSeating(arr, total){
  if (!arr) return null;
  if (arr.length === total) return arr;
  var out = arr.slice(0, total);
  while (out.length < total) out.push(null);
  return out;
}
function updateSeatStats(){
  var total = state.rows * state.cols;
  var active = total - state.disabled.length;
  document.getElementById('seat-stats').textContent =
    '有効席 ' + active + ' / 全 ' + total;
}

function makeLayoutSeat(idx){

  var isZF = state.zoneF.indexOf(idx) !== -1;
  var fixedId = state.fixed[idx];
  var fixedS = fixedId ? findStudent(fixedId) : null;

  var cls = 'seat';
  if (isDisabled) cls += ' disabled';
  if (state.selectedSeat === idx) cls += ' drop-hi';
  if (!isDisabled && isZM) cls += ' cbm';
  if (!isDisabled && isZF) cls += ' cbf';

  el.style.cursor = 'pointer';
  el.onclick = function(){ handleLayoutClick(idx); };

function handleLayoutClick(idx){
  var isDisabled = state.disabled.indexOf(idx) !== -1;
  var m = state.editMode || 'disable';
  if (m === 'disable') {
    if (isDisabled) state.disabled = state.disabled.filter(function(d){ return d !== idx; });
    else {
      state.disabled.push(idx);
      delete state.fixed[idx];
      state.zoneM = state.zoneM.filter(function(i){ return i !== idx; });
      state.zoneF = state.zoneF.filter(function(i){ return i !== idx; });
    }
    autoLayoutGroups(); save(); renderLayoutGrid(); updateSeatStats();
  } else if (m === 'zonem') {
    if (isDisabled) return;
    if (state.zoneM.indexOf(idx) !== -1) state.zoneM = state.zoneM.filter(function(i){ return i !== idx; });
    else { state.zoneM.push(idx); state.zoneF = state.zoneF.filter(function(i){ return i !== idx; }); }
    save(); renderLayoutGrid();
  } else if (m === 'zonef') {
    if (isDisabled) return;
    if (state.zoneF.indexOf(idx) !== -1) state.zoneF = state.zoneF.filter(function(i){ return i !== idx; });
    else { state.zoneF.push(idx); state.zoneM = state.zoneM.filter(function(i){ return i !== idx; }); }
    save(); renderLayoutGrid();
  } else if (m === 'fix') {
    if (isDisabled) return;
    state.selectedSeat = idx; renderLayoutGrid(); renderFixPanel(idx);
  }
}

// =================================================================
// GROUP HELPERS
// =================================================================
function seatIdxToGroup(seatIdx){
  for (var b = 0; b < state.groupLayout.length; b++) {
    var arr = state.groupLayout[b]; if (!arr) continue;
    for (var n = 0; n < arr.length; n++) if (arr[n] === seatIdx) return { b: b, n: n };
  }
  return null;
}

// auto layout: divide rows x cols by 2x2 (or other) blocks
function autoLayoutGroups(){
  var gs = state.groupSize;
  var rows = state.rows, cols = state.cols;
  // Block dims: prefer 2x2 for 4, 1x2 for 2, 1x3 for 3, 2x3 for 6, etc.
  var blockDim = {
    2: { r: 1, c: 2 },
    3: { r: 1, c: 3 },
    4: { r: 2, c: 2 },
    5: { r: 1, c: 5 },
    6: { r: 2, c: 3 }
  }[gs] || { r: 2, c: 2 };
  var BR = blockDim.r, BC = blockDim.c;

  state.groupLayout = [];
  var grpRows = Math.ceil(rows / BR);
  var grpCols = Math.ceil(cols / BC);

  for (var gr = 0; gr < grpRows; gr++) {
    for (var gc = 0; gc < grpCols; gc++) {
      var slots = [];
      for (var ir = 0; ir < BR; ir++) {
        for (var ic = 0; ic < BC; ic++) {
          var r = gr * BR + ir;
          var c = gc * BC + ic;
          if (r >= rows || c >= cols) { slots.push(null); continue; }
          var seatIdx = r * cols + c;
          if (state.disabled.indexOf(seatIdx) !== -1) { slots.push(null); continue; }
          slots.push(seatIdx);
        }
      }
      // Skip empty groups
      if (slots.some(function(s){ return s !== null; })) state.groupLayout.push(slots);
    }
  }
}

// =================================================================
// SEPARATION RULES
// =================================================================
function seatDist(a, b){
  var rA = Math.floor(a / state.cols), cA = a % state.cols;
  var rB = Math.floor(b / state.cols), cB = b % state.cols;
  return Math.max(Math.abs(rA - rB), Math.abs(cA - cB));
}
function checkSepRules(seating){
  for (var i = 0; i < state.sepRules.length; i++) {
    var r = state.sepRules[i];
    var pA = seating.indexOf(r.s1id);
    var pB = seating.indexOf(r.s2id);
    if (pA === -1 || pB === -1) continue;
    if (seatDist(pA, pB) < r.dist) return false;
  }
  return true;
}
function checkCompRules(seating){
  for (var i = 0; i < state.compRules.length; i++) {
    var r = state.compRules[i];
    var pA = seating.indexOf(r.s1id);
    var pB = seating.indexOf(r.s2id);
    if (pA === -1 || pB === -1) continue;
    if (seatDist(pA, pB) > r.dist) return false;
  }
  return true;
}
function countViolations(seating){
  var v = 0;
  state.sepRules.forEach(function(r){
    var pA = seating.indexOf(r.s1id), pB = seating.indexOf(r.s2id);
    if (pA === -1 || pB === -1) return;
    if (seatDist(pA, pB) < r.dist) v++;
  });
  state.compRules.forEach(function(r){
    var pA = seating.indexOf(r.s1id), pB = seating.indexOf(r.s2id);
    if (pA === -1 || pB === -1) return;
    if (seatDist(pA, pB) > r.dist) v++;
  });
  return v;
}

// =================================================================
// SEATING (Full shuffle, similar to original but flag-driven)
// =================================================================
function performFullShuffle(){
  var total = state.rows * state.cols;
  var activeIdx = [];
  for (var i = 0; i < total; i++) if (state.disabled.indexOf(i) === -1) activeIdx.push(i);

  var keepFixed = state.options.keepFixed;
  var keepZone  = state.options.keepZone;
  var sepRules  = state.options.sepRules;
  var sepGender = state.options.sepGender;

  var fixedVals = keepFixed ? Object.values(state.fixed) : [];
  var freeStudents = state.students.filter(function(s){ return fixedVals.indexOf(s.id) === -1; });
  var freeSeatIdx  = activeIdx.filter(function(i){ return !keepFixed || !state.fixed[i]; });

  var mSeats, fSeats, nSeats;
  if (keepZone) {
    mSeats = freeSeatIdx.filter(function(i){ return state.zoneM.indexOf(i) !== -1; });
    fSeats = freeSeatIdx.filter(function(i){ return state.zoneF.indexOf(i) !== -1; });
    nSeats = freeSeatIdx.filter(function(i){ return state.zoneM.indexOf(i) === -1 && state.zoneF.indexOf(i) === -1; });
  } else {
    mSeats = []; fSeats = []; nSeats = freeSeatIdx.slice();
  }

  var males   = freeStudents.filter(function(s){ return s.gender === 'male'; });
  var females = freeStudents.filter(function(s){ return s.gender === 'female'; });
  var others  = freeStudents.filter(function(s){ return !s.gender; }); // 性別未指定

  if (keepZone && males.length < mSeats.length) { showToast('男子専用席が男子の人数を超えています', 'error'); return null; }
  if (keepZone && females.length < fSeats.length) { showToast('女子専用席が女子の人数を超えています', 'error'); return null; }
  if (freeStudents.length > freeSeatIdx.length) { showToast('生徒数が空き席数より多いです', 'error'); return null; }

  function tryArrange(){
    var mC = males.slice(), fC = females.slice(), oC = others.slice();
    var mS = mSeats.slice(), fS = fSeats.slice(), nS = nSeats.slice();
    shuffle(mC); shuffle(fC); shuffle(oC); shuffle(mS); shuffle(fS); shuffle(nS);
    var s = []; for (var j = 0; j < total; j++) s.push(null);
    if (keepFixed) Object.keys(state.fixed).forEach(function(k){ s[parseInt(k)] = state.fixed[k]; });
    var mLeft = mC.slice(); mS.forEach(function(seat){ if (mLeft.length) s[seat] = mLeft.shift().id; });
    var fLeft = fC.slice(); fS.forEach(function(seat){ if (fLeft.length) s[seat] = fLeft.shift().id; });
    var remain;
    if (sepGender) { shuffle(mLeft); shuffle(fLeft); remain = mLeft.concat(fLeft).concat(oC); }
    else           { remain = mLeft.concat(fLeft).concat(oC); shuffle(remain); }
    nS.forEach(function(seat){ if (remain.length) s[seat] = remain.shift().id; });
    return s;
  }

  var seating = null;
  var MAX = clamp(state.options.maxTry, 50, 5000);
  var checkRules = state.options.sepRules || state.options.compRules;
  if (checkRules) {
    for (var t = 0; t < MAX; t++) {
      var c = tryArrange();
      var ok = true;
      if (state.options.sepRules  && !checkSepRules(c))  ok = false;
      if (state.options.compRules && !checkCompRules(c)) ok = false;
      if (ok) { seating = c; break; }
    }
    if (!seating) {
      var bestV = Infinity, best = null;
      for (var t2 = 0; t2 < 100; t2++) {
        var c2 = tryArrange();
        var v = countViolations(c2);
        if (v < bestV) { bestV = v; best = c2; }
      }
      seating = best;
      showToast('⚠ ルールを完全には満たせず（' + bestV + '件未達）', 'error');
    }
  } else {
    seating = tryArrange();
  }
  return seating;
}

// =================================================================
// GROUP CROSS SHUFFLE
// =================================================================
// Returns the seating array that should be used as input ("source") for shuffles.
// Prefers state.proposed (most recent), falls back to state.current.
function getSourceSeating(){
  function hasStudents(arr){ return arr && arr.some(function(s){ return !!s; }); }
  if (hasStudents(state.proposed)) return { board: 'proposed', arr: state.proposed };
  if (hasStudents(state.current))  return { board: 'current',  arr: state.current  };
  return null;
}

function performGroupCrossShuffle(){
  var src = getSourceSeating();
  if (!src) { showToast('まずは席を埋めてください', 'error'); return null; }
  var srcArr = src.arr;
  var groups = state.groupLayout;
  var N = groups.length;
  if (N <= 1) { showToast('班が1つ以下では実行できません', 'error'); return null; }
  var total = state.rows * state.cols;

  // Build move plan: for each (b,n) → desired toSeat. If desired slot missing, stay in place.
  var fixedSeats = {};
  Object.keys(state.fixed).forEach(function(k){ fixedSeats[parseInt(k)] = true; });
  var moves = [];
  for (var b = 0; b < N; b++) {
    var gFrom = groups[b];
    for (var n = 0; n < gFrom.length; n++) {
      var fromSeat = gFrom[n];
      if (fromSeat === null || fromSeat === undefined) continue;
      var sid = srcArr[fromSeat];
      if (!sid) continue;
      if (fixedSeats[fromSeat]) continue;
      var off = (state.groupOffsets[n] !== undefined) ? state.groupOffsets[n] : 0;
      var toB = ((b + off) % N + N) % N;
      var gTo = groups[toB];
      var toSeat = gTo ? gTo[n] : null;
      if (toSeat === null || toSeat === undefined || fixedSeats[toSeat]) toSeat = fromSeat;
      moves.push({ fromSeat: fromSeat, toSeat: toSeat, sid: sid, placed: false });
    }
  }

  // Place: pass 1 desired seat → pass 2 original seat → pass 3 any free non-disabled seat
  var out = []; for (var i = 0; i < total; i++) out.push(null);
  Object.keys(state.fixed).forEach(function(k){ out[parseInt(k)] = state.fixed[k]; });
  moves.forEach(function(m){ if (out[m.toSeat] == null) { out[m.toSeat] = m.sid; m.placed = true; } });
  moves.forEach(function(m){ if (m.placed) return; if (out[m.fromSeat] == null) { out[m.fromSeat] = m.sid; m.placed = true; } });
  moves.forEach(function(m){
    if (m.placed) return;
    for (var i = 0; i < total; i++) {
      if (state.disabled.indexOf(i) !== -1) continue;
      if (out[i] == null) { out[i] = m.sid; m.placed = true; break; }
    }
  });
  return out;
}

// =================================================================
// GROUP ROTATE SHUFFLE
// =================================================================
function performGroupRotateShuffle(){
  var src = getSourceSeating();
  if (!src) { showToast('まずは席を埋めてください', 'error'); return null; }
  var srcArr = src.arr;
  var groups = state.groupLayout;
  if (!groups.length) { showToast('班が設定されていません', 'error'); return null; }
  var out = srcArr.slice();
  var dir = state.groupRotation;

  groups.forEach(function(slots){
    var validSlots = slots.filter(function(x){ return x !== null && x !== undefined; });
    if (validSlots.length < 2) return;
    var freeSeats = validSlots.filter(function(seat){ return !state.fixed[seat]; });
    if (freeSeats.length < 2) return;
    var ids = freeSeats.map(function(seat){ return srcArr[seat]; });
    var rotated;
    if (dir === 'cw') rotated = [ids[ids.length-1]].concat(ids.slice(0, ids.length-1));
    else              rotated = ids.slice(1).concat([ids[0]]);
    freeSeats.forEach(function(seat, i){ out[seat] = rotated[i]; });
  });
  return out;
}

// =================================================================
// SHUFFLE RUNNERS (with movement animations)
// =================================================================
var _shuffleBackup = null;
var _baseline = null;  // 「クリア」で戻したい現在/新席のスナップショット

function saveBaseline(){
  _baseline = {
    current:  state.current  ? state.current.slice()  : null,
    proposed: state.proposed ? state.proposed.slice() : null
  };
}
function restoreFromBaseline(){
  if (!_baseline) {
    // ベースライン未保存の場合は標準配置を再構築
    state.current = null;
    state.proposed = null;
    copyCurrentToProposed(true);
    return;
  }
  state.current  = _baseline.current  ? _baseline.current.slice()  : emptySeating();
  state.proposed = _baseline.proposed ? _baseline.proposed.slice() : emptySeating();
}

function _ensureSeatingForShuffle(){
  // Ensure cur exists with default placement of all students if both boards are empty
  var src = getSourceSeating();
  if (src) return;
  copyCurrentToProposed(false);
}

function runFullShuffle(){
  if (state.students.length === 0) { showToast('名簿が空です', 'error'); return; }
  _ensureSeatingForShuffle();
  var src = getSourceSeating(); if (!src) return;
  var result = performFullShuffle();
  if (!result) return;
  doShuffleWithMovement(src, result);
}

function runGroupCrossShuffle(){
  if (state.groupLayout.length < 2) { showToast('班を2つ以上にして下さい', 'error'); return; }
  _ensureSeatingForShuffle();
  var src = getSourceSeating(); if (!src) return;
  var result = performGroupCrossShuffle();
  if (!result) return;
  doShuffleWithMovement(src, result);
}

function runGroupRotateShuffle(){
  if (state.groupLayout.length < 1) { showToast('班を設定してください', 'error'); return; }
  _ensureSeatingForShuffle();
  var src = getSourceSeating(); if (!src) return;
  var result = performGroupRotateShuffle();
  if (!result) return;
  doShuffleWithMovement(src, result);
}

// Save backup, set state, kick off the movement animation, then commit final state.
function doShuffleWithMovement(src, newSeating){
  _shuffleBackup = { current: state.current ? state.current.slice() : null, proposed: state.proposed ? state.proposed.slice() : null };
  // After shuffle: source becomes empty, proposed = newSeating (so the desks "move" out of source)
  // First, snapshot rects from source board (where desks currently are)
  var sourceBoardId = 'grid-' + src.board;
  var sourceEls = document.querySelectorAll('#' + sourceBoardId + ' .seat');
  var fromMap = {}; // sid → {rect, html}
  src.arr.forEach(function(sid, i){
    if (!sid || !sourceEls[i]) return;
    fromMap[sid] = { rect: sourceEls[i].getBoundingClientRect(), html: sourceEls[i].innerHTML };
  });

  // Apply new state: source becomes empty, proposed becomes the new permutation
  var emptyArr = []; for (var i = 0; i < state.rows * state.cols; i++) emptyArr.push(null);
  if (src.board === 'current') state.current = emptyArr;
  state.proposed = newSeating;
  saveBaseline();  // シャッフル直後の状態を「元の席」にする
  renderAllBoards();

  // Animate from old positions to new positions on the proposed board
  if (!state.options.showMovement || state.options.animSpeed === 'skip') {
    save();
    if (state.options.confetti) launchConfetti();
    return;
  }
  playMovementAnimation(fromMap, function(){
    save();
    renderAllBoards();
    if (state.options.confetti) launchConfetti();
    if (state.options.sound) playFanfare();
  });
}

function playMovementAnimation(fromMap, onDone){
  var sf = (state.options.animSpeed === 'fast') ? 0.55 : 1.0;
  var DUR = 900 * sf;
  var STAGGER = 28 * sf;
  animSkipFlag = false;
  animTimers = [];

  // Get target rects from the now-rendered proposed grid
  var propEls = document.querySelectorAll('#grid-proposed .seat');
  var toMap = {};
  state.proposed.forEach(function(sid, i){
    if (!sid || !propEls[i]) return;
    toMap[sid] = propEls[i].getBoundingClientRect();
  });

  // Hide proposed seats during animation (they will be revealed when clones land)
  propEls.forEach(function(el, i){ if (state.proposed[i]) el.style.opacity = 0; });

  // Show overlay with title
  var overlay = document.getElementById('anim-overlay');
  var title = document.getElementById('anim-title');
  var stage = document.getElementById('anim-stage');
  stage.innerHTML = '';
  title.textContent = '🪑 みんな移動中…';
  overlay.classList.add('show');
  overlay.style.background = 'rgba(58,71,98,.18)'; // softer veil
  overlay.style.backdropFilter = 'blur(0px)';
  if (state.options.sound) playWhoosh();

  // Create clones
  var clones = [];
  Object.keys(fromMap).forEach(function(sid){
    var to = toMap[sid]; if (!to) return;
    var f = fromMap[sid];
    var clone = document.createElement('div');
    clone.className = 'seat fly-clone';
    clone.innerHTML = f.html;
    clone.style.position = 'fixed';
    clone.style.left = f.rect.left + 'px';
    clone.style.top  = f.rect.top  + 'px';
    clone.style.width  = f.rect.width  + 'px';
    clone.style.height = f.rect.height + 'px';
    clone.style.zIndex = 401;
    clone.style.margin = 0;
    clone.style.transition = 'transform ' + (DUR/1000) + 's cubic-bezier(.55,.05,.25,1), opacity .25s';
    clone.style.pointerEvents = 'none';
    document.body.appendChild(clone);
    clones.push({ clone: clone, dx: to.left - f.rect.left, dy: to.top - f.rect.top });
  });

  // Trigger the move with stagger
  setTimer(function(){
    clones.forEach(function(c, i){
      setTimer(function(){
        c.clone.style.transform = 'translate(' + c.dx + 'px, ' + c.dy + 'px)';
      }, i * STAGGER);
    });
  }, 30);

  // Cleanup after the longest animation
  var totalDur = DUR + clones.length * STAGGER + 100;
  setTimer(function(){
    clones.forEach(function(c){ c.clone.remove(); });
    propEls.forEach(function(el){ el.style.opacity = ''; });
    overlay.classList.remove('show');
    overlay.style.background = '';
    overlay.style.backdropFilter = '';
    onDone();
  }, totalDur);
}

function toggleRotateDir(){
  state.groupRotation = (state.groupRotation === 'cw') ? 'ccw' : 'cw';
  document.getElementById('dir-toggle').textContent = (state.groupRotation === 'cw') ? '↻' : '↺';
  showToast('回転方向: ' + (state.groupRotation === 'cw' ? '時計回り' : '反時計回り'));
  save();
}

// =================================================================
// ANIMATION HELPERS
// =================================================================
function setTimer(fn, ms){
  var t = setTimeout(function(){
    if (!animSkipFlag) fn();
  }, ms);
  animTimers.push(t);
}
function skipAnimation(){
  animSkipFlag = true;
  animTimers.forEach(function(t){ clearTimeout(t); });
  animTimers = [];
  document.getElementById('anim-overlay').classList.remove('show');
  renderAllBoards();
}

// Sound
var audioCtx = null;
function getAudio(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playWhoosh(){
  try {
    var ctx = getAudio();
    var buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) {
      var t = i / ctx.sampleRate;
      var env = Math.pow(1 - t / 0.5, 2.5);
      data[i] = (Math.random() * 2 - 1) * env * 0.5
              + Math.sin(2 * Math.PI * (200 + t * 1500) * t) * env * 0.25;
    }
    var s = ctx.createBufferSource(); s.buffer = buf;
    var g = ctx.createGain(); g.gain.setValueAtTime(0.5, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    s.connect(g); g.connect(ctx.destination); s.start();
  } catch(e){}
}
function playDrumRoll(duration){
  try {
    var ctx = getAudio();
    var interval = 0.04;
    var count = Math.floor(duration / interval);
    for (var n = 0; n < count; n++) {
      (function(idx){
        setTimeout(function(){
          if (animSkipFlag) return;
          try {
            var buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < d.length; i++) {
              var t2 = i / ctx.sampleRate;
              d[i] = (Math.random() * 2 - 1) * Math.exp(-t2 * 60) * 0.5;
            }
            var s2 = ctx.createBufferSource(); s2.buffer = buf;
            var g2 = ctx.createGain();
            g2.gain.setValueAtTime(0.2 + (idx / count) * 0.5, ctx.currentTime);
            s2.connect(g2); g2.connect(ctx.destination); s2.start();
          } catch(e){}
        }, idx * interval * 1000);
      })(n);
    }
  } catch(e){}
}
function playFanfare(){
  try {
    var ctx = getAudio();
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(f, i){
      var o = ctx.createOscillator(); var g = ctx.createGain();
      var t = ctx.currentTime + i * 0.1;
      o.frequency.setValueAtTime(f, t); o.type = 'triangle';
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.4);
    });
  } catch(e){}
}
function launchConfetti(){
  var colors = ['#ff77a8','#ffd83d','#5fd47a','#4ea5ff','#a973ff','#ff9f43'];
  for (var i = 0; i < 70; i++) {
    (function(idx){
      setTimeout(function(){
        var el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width  = (8 + Math.random() * 8) + 'px';
        el.style.height = (8 + Math.random() * 8) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        var dur = 1.2 + Math.random() * 1.5;
        el.style.animationDuration = dur + 's';
        document.body.appendChild(el);
        setTimeout(function(){ el.remove(); }, dur * 1000 + 100);
      }, idx * 25);
    })(i);
  }
}

// =================================================================
// BOARDS RENDERING + DRAG-DROP
// =================================================================
function renderAllBoards(){
  renderBoard('current');
  renderBoard('proposed');
  renderLayoutGrid();
}

function renderBoard(which){
  var grid = document.getElementById('grid-' + which);
  grid.style.gridTemplateColumns = 'repeat(' + state.cols + ', 1fr)';
  grid.innerHTML = '';
  var seating = (which === 'current') ? state.current : state.proposed;
  var total = state.rows * state.cols;
  for (var i = 0; i < total; i++) grid.appendChild(makeBoardSeat(i, seating, which));

  // Set up drop zones on the grid itself
  grid.ondragover = function(e){ e.preventDefault(); };
  grid.ondrop = function(e){ e.preventDefault(); };
}

function makeBoardSeat(idx, seating, which){
  var el = document.createElement('div');
  var isDisabled = state.disabled.indexOf(idx) !== -1;
  var sid = seating ? seating[idx] : null;
  var s = sid ? findStudent(sid) : null;
  var cls = 'seat';
  if (isDisabled) {
    cls += ' disabled';
  } else if (!s) {
    cls += ' empty';
  }
  // Add gender card color when occupied
  if (s && s.gender) cls += ' ' + genderCardClass(s.gender);
  el.className = cls;
  el.dataset.seat = idx;
  el.dataset.board = which;

  var inner = '';
  if (state.zoneM.indexOf(idx) !== -1 && !s) inner += '<span class="zoneM">男子席</span>';
  if (state.zoneF.indexOf(idx) !== -1 && !s) inner += '<span class="zoneF">女子席</span>';
  if (state.fixed[idx]) inner += '<span class="pin">📌</span>';

  if (isDisabled) {
    inner += '<span style="font-size:18px; opacity:.5">✕</span>';
  } else if (s) {
    inner += '<span class="nm">' + s.name + '</span>';
  }
  el.innerHTML = inner;

  // Drag-and-drop wiring (only if has student and not disabled)
  if (s && !isDisabled) {
    el.draggable = true;
    el.addEventListener('dragstart', function(ev){
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', JSON.stringify({ from: which, idx: idx }));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', function(){ el.classList.remove('dragging'); });
    // 中央クリックで名前を編集（ドラッグ操作との両立のため、座席中央 50% を判定）
    el.addEventListener('click', function(ev){
      if (el.classList.contains('editing')) return;
      var r = el.getBoundingClientRect();
      var cx = ev.clientX - r.left;
      var cy = ev.clientY - r.top;
      var inX = cx >= r.width * 0.25 && cx <= r.width * 0.75;
      var inY = cy >= r.height * 0.25 && cy <= r.height * 0.75;
      if (inX && inY) startInlineNameEdit(el, sid);
    });
    // Touch fallback
    setupTouchDrag(el, which, idx);
  }
  if (!isDisabled) {
    el.addEventListener('dragover', function(ev){ ev.preventDefault(); el.classList.add('drop-hi'); });
    el.addEventListener('dragleave', function(){ el.classList.remove('drop-hi'); });
    el.addEventListener('drop', function(ev){
      ev.preventDefault();
      el.classList.remove('drop-hi');
      try {
        var data = JSON.parse(ev.dataTransfer.getData('text/plain'));
        handleDrop(data.from, data.idx, which, idx);
      } catch(e){}
    });
  }
  return el;
}

// 名前の手入力編集：座席の中央クリックで起動
function startInlineNameEdit(seatEl, sid){
  var nm = seatEl.querySelector('.nm');
  if (!nm) return;
  var s = findStudent(sid);
  if (!s) return;
  document.querySelectorAll('.seat.editing input').forEach(function(inp){ inp.blur(); });
  seatEl.classList.add('editing');
  seatEl.draggable = false;
  var input = document.createElement('input');
  input.type = 'text';
  input.value = s.name;
  input.className = 'inline-name-edit';
  nm.replaceWith(input);
  input.focus(); input.select();
  var done = false;
  function commit(){
    if (done) return; done = true;
    var v = (input.value || '').trim();
    if (v && v !== s.name) {
      state.students = state.students.map(function(x){ return x.id === sid ? { id:x.id, name:v, gender:x.gender } : x; });
      save();
    }
    seatEl.classList.remove('editing');
    seatEl.draggable = true;
    renderAllBoards();
    renderRoster();
  }
  function cancel(){
    if (done) return; done = true;
    seatEl.classList.remove('editing');
    seatEl.draggable = true;
    renderAllBoards();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape') { cancel(); }
  });
  input.addEventListener('mousedown',   function(e){ e.stopPropagation(); });
  input.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  input.addEventListener('dragstart',   function(e){ e.preventDefault(); e.stopPropagation(); });
}

// Drag semantics ("desk literally moves"):
// - current→proposed : student leaves current[fromIdx] (becomes empty) and appears at proposed[toIdx].
//                      If proposed[toIdx] was occupied by Y, Y is bumped back to current[fromIdx]
//                      (swap across boards). Invariant: current ⊔ proposed contains every student exactly once.
// - proposed→proposed: swap two seats on proposed.
// - current→current  : swap two seats on current (rearrange the source).
// - proposed→current : student returns from proposed to current. If current[toIdx] was occupied,
//                      that student gets bumped to proposed[fromIdx] (swap).
function handleDrop(fromBoard, fromIdx, toBoard, toIdx){
  if (fromBoard === toBoard && fromIdx === toIdx) return;
  if (state.disabled.indexOf(toIdx) !== -1) return;

  var cur = (state.current  || []).slice();
  var prop = (state.proposed || []).slice();
  var total = state.rows * state.cols;
  while (cur .length < total) cur .push(null);
  while (prop.length < total) prop.push(null);

  function swapInArr(arr, a, b){ var x = arr[a]; arr[a] = arr[b] || null; arr[b] = x || null; }

  if (fromBoard === 'proposed' && toBoard === 'proposed') {
    if (!prop[fromIdx]) return;
    swapInArr(prop, fromIdx, toIdx);
  } else if (fromBoard === 'current' && toBoard === 'current') {
    if (!cur[fromIdx]) return;
    swapInArr(cur, fromIdx, toIdx);
  } else if (fromBoard === 'current' && toBoard === 'proposed') {
    var sid = cur[fromIdx]; if (!sid) return;
    // Move sid from current to proposed[toIdx], bumping the previous occupant back to current[fromIdx]
    var bumped = prop[toIdx] || null;
    prop[toIdx]  = sid;
    cur [fromIdx] = bumped;
  } else if (fromBoard === 'proposed' && toBoard === 'current') {
    var sid2 = prop[fromIdx]; if (!sid2) return;
    var bumped2 = cur[toIdx] || null;
    cur [toIdx]   = sid2;
    prop[fromIdx] = bumped2;
  }
  state.current  = cur;
  state.proposed = prop;
  save();
  renderAllBoards();
}

// Touch drag fallback (PointerEvents)
var touchDrag = null;
function setupTouchDrag(el, board, idx){
  el.addEventListener('pointerdown', function(ev){
    if (ev.pointerType !== 'touch') return;
    ev.preventDefault();
    var rect = el.getBoundingClientRect();
    var clone = el.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.left = rect.left + 'px';
    clone.style.top  = rect.top  + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.zIndex = 500;
    clone.style.pointerEvents = 'none';
    clone.style.opacity = .9;
    clone.style.transform = 'scale(1.05) rotate(-3deg)';
    document.body.appendChild(clone);
    touchDrag = { from: board, idx: idx, clone: clone, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top };
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', function(ev){
    if (!touchDrag || ev.pointerType !== 'touch') return;
    touchDrag.clone.style.left = (ev.clientX - touchDrag.offX) + 'px';
    touchDrag.clone.style.top  = (ev.clientY - touchDrag.offY) + 'px';
  });
  el.addEventListener('pointerup', function(ev){
    if (!touchDrag) return;
    var x = ev.clientX, y = ev.clientY;
    touchDrag.clone.remove();
    el.classList.remove('dragging');
    var target = document.elementFromPoint(x, y);
    while (target && !(target.classList && target.classList.contains('seat') && target.dataset.seat !== undefined)) target = target.parentElement;
    if (target) {
      var toBoard = target.dataset.board;
      var toIdx = parseInt(target.dataset.seat);
      handleDrop(touchDrag.from, touchDrag.idx, toBoard, toIdx);
    }
    touchDrag = null;
  });
  el.addEventListener('pointercancel', function(){
    if (touchDrag) { touchDrag.clone.remove(); touchDrag = null; }
    el.classList.remove('dragging');
  });
}

// =================================================================
// COPY / CONFIRM / CLEAR
// =================================================================
function emptySeating(){
  var total = state.rows * state.cols;
  var arr = []; for (var i = 0; i < total; i++) arr.push(null);
  return arr;
}
// Initialize current with default placement of all students if empty.
// Proposed defaults to empty so the user can drag/shuffle into it.
function copyCurrentToProposed(force){
  var total = state.rows * state.cols;
  var initialized = false;
  if (!state.current || state.current.length !== total) {
    state.current = emptySeating();
    var idx = 0;
    state.students.forEach(function(s){
      while (idx < total && state.disabled.indexOf(idx) !== -1) idx++;
      if (idx < total) { state.current[idx] = s.id; idx++; }
    });
    initialized = true;
  }
  if (!state.proposed || state.proposed.length !== total || force) {
    state.proposed = emptySeating();
    initialized = true;
  }
  if (initialized || !_baseline) saveBaseline();
  save();
}
function clearProposed(){
  // ベースライン（手動操作前の席順）に戻す。手動で動かしたカードが元の席に戻る。
  restoreFromBaseline();
  save(); renderAllBoards();
  showToast('元の席に戻しました');
}
function resetCurrent(){
  // Restore current from backup (last shuffle) or from latest history entry; clear proposed
  if (_shuffleBackup) {
    state.current = _shuffleBackup.current ? _shuffleBackup.current.slice() : emptySeating();
    state.proposed = emptySeating();
    _shuffleBackup = null;
  } else if (state.history && state.history.length) {
    state.current = state.history[0].seating.slice();
    state.proposed = emptySeating();
  } else {
    state.current = null;
    state.proposed = emptySeating();
    copyCurrentToProposed(false);
  }
  save(); renderAllBoards();
  showToast('やり直しました');
}
function confirmSeating(){
  if (!state.proposed || !state.proposed.some(function(s){ return !!s; })) {
    showToast('まず席を作ってください', 'error'); return;
  }
  state.current = state.proposed.slice();
  state.proposed = emptySeating();
  _shuffleBackup = null;
  saveBaseline();
  state.history = [{
    id: uid(),
    date: new Date().toLocaleString('ja-JP'),
    seating: state.current.slice(),
    rows: state.rows, cols: state.cols,
    disabled: state.disabled.slice(),
    zoneM: state.zoneM.slice(), zoneF: state.zoneF.slice()
  }].concat(state.history).slice(0, 30);
  save(); renderAllBoards();
  if (state.options.confetti) launchConfetti();
  if (state.options.sound) playFanfare();
  showToast('新しい席に決まりました');
}

function renderHistory(){
  var list = document.getElementById('history-list');
  document.getElementById('history-title').textContent = '📋 席替え履歴（' + state.history.length + '件）';
  if (!state.history.length) {
    list.innerHTML = '<div class="card" style="text-align:center; padding:32px; color:var(--soft)">まだ履歴がありません</div>';
    return;
  }
  list.innerHTML = state.history.map(function(r, i){
    var hid = r.id;
    return '<div class="history-card" id="hcard-' + hid + '">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px">' +
        '<div><span style="font-weight:700; color:var(--purple)">#' + (state.history.length - i) + '</span>' +
        '<span style="margin-left:6px; font-size:12px; color:var(--soft)">' + r.date + '</span></div>' +
        '<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; position:relative">' +
          '<div class="export-menu-wrap">' +
            '<button class="btn" onclick="toggleExportMenu(\'' + hid + '\', event)">📤 書き出し ▾</button>' +
            '<div class="export-menu" id="emenu-' + hid + '" style="display:none">' +
              '<button onclick="exportHistory(\'' + hid + '\',\'json\')">JSON</button>' +
              '<button onclick="exportHistory(\'' + hid + '\',\'jpeg\')">JPEG</button>' +
              '<button onclick="exportHistory(\'' + hid + '\',\'pdf\')">PDF</button>' +
            '</div>' +
          '</div>' +
          '<button class="btn" onclick="printHistory(\'' + hid + '\')">🖨 印刷</button>' +
          '<button class="btn btn-primary" onclick="restoreHistory(\'' + hid + '\')">この席順に戻す</button>' +
        '</div>' +
      '</div>' +
      buildHistoryGrid(r) +
    '</div>';
  }).join('');
}

function toggleExportMenu(hid, ev){
  if (ev) ev.stopPropagation();
  // close other menus
  document.querySelectorAll('.export-menu').forEach(function(m){ if (m.id !== 'emenu-' + hid) m.style.display = 'none'; });
  var m = document.getElementById('emenu-' + hid);
  if (!m) return;
  m.style.display = (m.style.display === 'none') ? 'block' : 'none';
}
document.addEventListener('click', function(){
  document.querySelectorAll('.export-menu').forEach(function(m){ m.style.display = 'none'; });
});

function getHistoryEntry(hid){ return state.history.find(function(h){ return h.id === hid; }); }

function printHistory(hid){
  var r = getHistoryEntry(hid); if (!r) return;
  buildPrintAreaForHistory(r);
  setTimeout(function(){ window.print(); }, 50);
}

function exportHistory(hid, fmt){
  var r = getHistoryEntry(hid); if (!r) return;
  if (fmt === 'json') {
    var json = JSON.stringify(r, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    downloadBlob(blob, 'seating_' + r.id + '.json');
  } else if (fmt === 'pdf') {
    // PDF: build print area, ask user to choose "Save as PDF" in browser dialog
    buildPrintAreaForHistory(r);
    showToast('印刷ダイアログで「PDF として保存」を選んでください');
    setTimeout(function(){ window.print(); }, 50);
  } else if (fmt === 'jpeg') {
    exportHistoryAsImage(r);
  }
  toggleExportMenu(hid);
}

function buildPrintAreaForHistory(r){
  var area = document.getElementById('print-area');
  var dateStr = r.date || '';
  var bbTop = (state.boardSide === 'top'  || state.boardSide === 'left' || !state.boardSide);
  var bbBottom = (state.boardSide === 'bottom');
  var html = '<h1>席順</h1>' + '<div class="print-meta">' + dateStr + '</div>';
  if (bbTop) html += '<div class="print-blackboard">黒板</div>';
  html += '<div class="print-grid" style="grid-template-columns:repeat(' + r.cols + ',1fr); grid-template-rows:repeat(' + r.rows + ',1fr)">';
  var total = r.rows * r.cols;
  for (var i = 0; i < total; i++) {
    var sid = r.seating[i];
    var s = sid ? findStudent(sid) : null;
    var isD = (r.disabled || []).indexOf(i) !== -1;
    var cls = 'print-seat' + (isD ? ' disabled' : (s ? '' : ' empty'));
    var bg = '';
    if (s && s.gender === 'male')   bg = ' style="background:#cfe1f2"';
    else if (s && s.gender === 'female') bg = ' style="background:#f2cdd9"';
    var inner = isD ? '✕' : (s ? s.name : '');
    html += '<div class="' + cls + '"' + bg + '>' + inner + '</div>';
  }
  html += '</div>';
  if (bbBottom) html += '<div class="print-blackboard">黒板</div>';
  area.innerHTML = html;
}

function exportHistoryAsImage(r){
  // Use html2canvas if available, else load via CDN
  function doRender(){
    var card = document.getElementById('hcard-' + r.id);
    if (!card) { showToast('要素が見つかりません', 'error'); return; }
    html2canvas(card, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas){
      canvas.toBlob(function(blob){
        if (blob) downloadBlob(blob, 'seating_' + r.id + '.jpg');
      }, 'image/jpeg', 0.92);
    }).catch(function(){ showToast('画像書き出しに失敗', 'error'); });
  }
  if (typeof html2canvas === 'undefined') {
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = doRender;
    sc.onerror = function(){ showToast('画像ライブラリ読込失敗', 'error'); };
    document.head.appendChild(sc);
  } else {
    doRender();
  }
}

function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function buildHistoryGrid(r){
  var html = '<div class="history-grid" style="grid-template-columns:repeat(' + r.cols + ',1fr)">';
  var total = r.rows * r.cols;
  for (var i = 0; i < total; i++) {
    var sid = r.seating[i];
    var s = sid ? findStudent(sid) : null;
    var isD = (r.disabled || []).indexOf(i) !== -1;
    var cls = 'seat' + (isD ? ' disabled' : (s ? '' : ' empty'));
    var inner = '';
    if (isD) inner = '<span style="font-size:11px; opacity:.5">✕</span>';
    else if (s) {
      if (s.gender) cls += ' ' + genderCardClass(s.gender);
      inner = '<span class="nm">' + s.name + '</span>';
    }
    html += '<div class="' + cls + '">' + inner + '</div>';
  }
  return html + '</div>';
}
function restoreHistory(id){
  var r = state.history.find(function(h){ return h.id === id; });
  if (!r) return;
  state.rows = r.rows; state.cols = r.cols;
  state.disabled = (r.disabled || []).slice();
  state.current = r.seating.slice();
  state.proposed = emptySeating();
  _shuffleBackup = null;
  saveBaseline();
  // Reflect new dims in 初期設定 inputs
  document.getElementById('rows').value = r.rows;
  document.getElementById('cols').value = r.cols;
  autoLayoutGroups();
  save();
  // 現在開いているタブが手動／自動／履歴のどれであっても、新しい現席をすぐ反映
  var activeTabBtn = document.querySelector('.tab.active');
  var activeTab = activeTabBtn ? activeTabBtn.dataset.tab : 'manual';
  if (activeTab === 'history') {
    // 履歴タブの場合は手動席替えに切り替えて確認しやすく
    switchTab('manual');
  } else if (activeTab === 'manual' || activeTab === 'auto') {
    // 既に席替えタブにいる場合はその場で再描画
    renderAllBoards();
  } else {
    // 初期設定にいる場合はそのまま再描画（layout-grid に反映）
    renderLayoutGrid();
  }
  showToast('履歴から復元しました');
}

function isGenderKw(s){ var t = (s||'').trim().toLowerCase(); return ['男','女','m','f','male','female','boy','girl','♂','♀'].indexOf(t) !== -1; }
function parseGender(str){
  var s = (str||'').trim().toLowerCase();
  if (s === '女' || s === 'f' || s === 'female' || s === 'girl' || s === '♀') return 'female';
  if (s === '男' || s === 'm' || s === 'male'   || s === 'boy'  || s === '♂') return 'male';
  return '';
}
function parseLine(line){
  var parts;
  if (line.indexOf('\t') !== -1) parts = line.split('\t');
  else if (line.indexOf(',') !== -1) parts = line.split(',');
  else parts = line.split(/[\s　]+/);
  parts = parts.map(function(p){ return p.trim(); }).filter(function(p){ return p.length > 0; });
  if (!parts.length) return null;
  var last = parts[parts.length - 1];
  if (parts.length >= 2 && isGenderKw(last)) return { name: parts.slice(0, parts.length - 1).join(' '), gender: parseGender(last) };
  return { name: parts.join(' '), gender: '' };
}
function importFromPaste(){
  var raw = document.getElementById('paste-area').value.trim();
  if (!raw) { showToast('テキストを入力してください', 'error'); return; }
  var parsed = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; })
    .map(parseLine).filter(function(p){ return p && p.name; });
  if (!parsed.length) { showToast('有効な名前が見つかりませんでした', 'error'); return; }
  showImportPreview(parsed, 'paste');
}
function importFromGsheet(){
  var raw = document.getElementById('gsheet-area').value.trim();
  if (!raw) { showToast('テキストを貼り付けてください', 'error'); return; }
  var parsed = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; })
    .map(parseLine).filter(function(p){ return p && p.name; });
  if (!parsed.length) { showToast('有効な名前が見つかりませんでした', 'error'); return; }
  showImportPreview(parsed, 'gsheet');
}
function importFromGsheetUrl(){
  var url = document.getElementById('gsheet-url').value.trim();
  if (!url) { showToast('URL を入力してください', 'error'); return; }
  var m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (!m) { showToast('Google スプレッドシートの URL を貼り付けてください', 'error'); return; }
  var sheetId = m[1];
  var gidMatch = url.match(/[?#&]gid=(\d+)/);
  var gid = gidMatch ? gidMatch[1] : '0';
  var csvUrl = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + gid;
  showToast('読み込み中…');
  fetch(csvUrl).then(function(r){
    if (!r.ok) throw new Error('http ' + r.status);
    return r.text();
  }).then(function(text){
    parseCSV(text);
  }).catch(function(){
    showToast('読込失敗。シートを「リンクを知っている全員が閲覧可」または「ウェブに公開」にしてください', 'error');
  });
}
function showImportPreview(parsed, source){
  pendingImport = parsed;
  var containerId = source === 'paste' ? 'paste-preview'
                   : source === 'gsheet' ? 'gsheet-preview'
                   : 'excel-preview';
  var container = document.getElementById(containerId);
  var m = parsed.filter(function(p){ return p.gender === 'male'; }).length;
  var f = parsed.filter(function(p){ return p.gender === 'female'; }).length;
  var u = parsed.filter(function(p){ return !p.gender; }).length;
  var rowsHtml = parsed.map(function(p, i){
    var bg = (p.gender === 'male') ? '#eef4f9' : (p.gender === 'female') ? '#f7eef2' : '#f7f6f1';
    var col = genderColor(p.gender);
    return '<div id="prow-' + source + '-' + i + '" style="display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:8px; background:' + bg + '">' +
      '<span style="font-weight:600; color:' + col + '; flex:1; min-width:0; word-break:break-all">' + p.name + '</span>' +
      '<select onchange="updatePendingGender(' + i + ',\'' + source + '\',this.value)" style="padding:3px 8px; border:1px solid var(--line); border-radius:6px; font-weight:600">' +
        '<option value=""'       + (!p.gender                 ? ' selected' : '') + '>―</option>' +
        '<option value="male"'   + (p.gender === 'male'   ? ' selected' : '') + '>男</option>' +
        '<option value="female"' + (p.gender === 'female' ? ' selected' : '') + '>女</option>' +
      '</select>' +
    '</div>';
  }).join('');
  container.style.display = 'block';
  container.innerHTML =
    '<div style="background:#fff8e1; border:2.5px solid var(--ink); border-radius:12px; padding:12px">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px">' +
        '<span id="pcount-' + source + '" style="font-weight:700">' + parsed.length + '人検出（男' + m + ' / 女' + f + ' / 未指定' + u + '）</span>' +
        '<div style="display:flex; gap:6px">' +
          '<label class="toggle"><input type="checkbox" id="' + source + '-replace"> 上書き</label>' +
          '<button class="btn btn-primary" onclick="confirmImport(\'' + source + '\')">✅ 読込</button>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex; flex-direction:column; gap:4px; max-height:200px; overflow-y:auto">' + rowsHtml + '</div>' +
    '</div>';
}
function updatePendingGender(i, src, g){
  if (!pendingImport || !pendingImport[i]) return;
  pendingImport[i].gender = g;
  var row = document.getElementById('prow-' + src + '-' + i);
  if (row) row.style.background = (g === 'male') ? '#eef4f9' : (g === 'female') ? '#f7eef2' : '#f7f6f1';
  var m = pendingImport.filter(function(p){ return p.gender === 'male'; }).length;
  var f = pendingImport.filter(function(p){ return p.gender === 'female'; }).length;
  var u = pendingImport.filter(function(p){ return !p.gender; }).length;
  var c = document.getElementById('pcount-' + src);
  if (c) c.textContent = pendingImport.length + '人検出（男' + m + ' / 女' + f + ' / 未指定' + u + '）';
}
function confirmImport(src){
  if (!pendingImport) return;
  var replEl = document.getElementById(src + '-replace');
  var repl = replEl ? replEl.checked : false;
  var newOnes = pendingImport.map(function(p){ return { id: uid(), name: p.name, gender: p.gender }; });
  if (repl) {
    state.students = newOnes; state.fixed = {}; state.current = null; state.proposed = null;
    showToast(newOnes.length + '人を読み込みました');
  } else {
    var existing = {}; state.students.forEach(function(s){ existing[s.name] = true; });
    var add = newOnes.filter(function(s){ return !existing[s.name]; });
    state.students = state.students.concat(add);
    var skipped = newOnes.length - add.length;
    showToast(add.length + '人を追加' + (skipped > 0 ? '（' + skipped + '人重複スキップ）' : ''));
  }
  pendingImport = null;
  if (src === 'paste') {
    document.getElementById('paste-area').value = '';
    document.getElementById('paste-preview').style.display = 'none';
  } else if (src === 'gsheet') {
    document.getElementById('gsheet-area').value = '';
    document.getElementById('gsheet-preview').style.display = 'none';
  } else {
    document.getElementById('excel-preview').style.display = 'none';
    document.getElementById('excel-file').value = '';
  }
  save(); renderRoster();
}

function handleExcelFile(file){
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    var rd = new FileReader();
    rd.onload = function(e){ parseCSV(e.target.result); };
    rd.readAsText(file, 'UTF-8');
  } else {
    if (typeof XLSX === 'undefined') {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = function(){ readXLSX(file); };
      sc.onerror = function(){ showToast('ライブラリ読込失敗。CSVをお試しください', 'error'); };
      document.head.appendChild(sc);
    } else readXLSX(file);
  }
}
function readXLSX(file){
  var rd = new FileReader();
  rd.onload = function(e){
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      showExcelPreview(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }));
    } catch(err){ showToast('読込失敗', 'error'); }
  };
  rd.readAsArrayBuffer(file);
}
function parseCSV(text){
  var rows = text.split(/\r?\n/).map(function(l){ return l.split(',').map(function(c){ return c.replace(/^"|"$/g, '').trim(); }); });
  showExcelPreview(rows);
}
function showExcelPreview(rows){
  var start = 0;
  var first = (rows[0] ? String(rows[0][0] || '') : '').toLowerCase();
  if (['名前','氏名','name','生徒名'].indexOf(first) !== -1) start = 1;
  var parsed = [];
  for (var i = start; i < rows.length; i++) {
    var raw = String(rows[i][0] || '').trim(); if (!raw) continue;
    var colB = String(rows[i][1] || '').trim();
    parsed.push({ name: raw, gender: colB ? parseGender(colB) : '' });
  }
  if (!parsed.length) {
    var p = document.getElementById('excel-preview');
    p.style.display = 'block';
    p.innerHTML = '<div style="color:#c0392b; font-weight:700">データが見つかりませんでした</div>';
    return;
  }
  showImportPreview(parsed, 'excel');
}
