<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(135deg,#f0f9ff,#e0f2fe 50%,#f0fdf4);min-height:100vh;color:#0f172a}
.header{background:linear-gradient(90deg,#0ea5e9,#6366f1);padding:18px 20px 14px;color:#fff;box-shadow:0 2px 16px rgba(14,165,233,.3)}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.header p{font-size:12px;opacity:.85;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;position:sticky;top:0;z-index:100}
.tab-btn{flex:1;padding:12px 0;border:none;background:none;font-size:13px;font-weight:400;color:#64748b;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;transition:all .2s}
.tab-btn.active{font-weight:700;color:#0ea5e9;border-bottom-color:#0ea5e9}
.content{max-width:700px;margin:0 auto;padding:20px 16px 40px}
.panel{display:none;flex-direction:column;gap:20px}
.panel.active{display:flex}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px}
input[type=text],input[type=number],select{padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:#0ea5e9}
.btn{padding:8px 18px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 2px 10px rgba(99,102,241,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.35)}
.btn-primary:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:none;transform:none;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid #e2e8f0;color:#64748b}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9}
.btn-big{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.5px}
.student-tags{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow-y:auto;margin-top:12px}
.tag{display:flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px 4px 6px;font-size:13px}
.tag.male{background:#eff6ff;border:1.5px solid #bfdbfe}
.tag.female{background:#fdf2f8;border:1.5px solid #fbcfe8}
.tag-remove{border:none;background:none;cursor:pointer;color:#94a3b8;font-size:16px;line-height:1;padding:0}
.tag-remove:hover{color:#ef4444}
.gender-sel{border:none !important;background:transparent !important;font-size:13px;font-weight:700;cursor:pointer;padding:0 2px;font-family:inherit;outline:none}
.mode-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mode-btn{padding:6px 13px;border-radius:99px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;font-weight:400;transition:all .2s;white-space:nowrap}
.mode-btn.active{border-color:#6366f1;background:#eef2ff;color:#6366f1;font-weight:700}
.seat-grid{display:grid;gap:6px}
.seat{border:1.5px solid #cbd5e1;border-radius:8px;padding:6px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:#f0f4f8;font-size:12px;position:relative;user-select:none}
.seat.disabled{opacity:.25;background:#e2e8f0;cursor:pointer}
.seat.selected{background:#fef9c3 !important;border:2px solid #f59e0b !important}
.seat.occupied{background:#fff}
.seat.cbm{background:#dbeafe !important}
.seat.cbf{background:#fce7f3 !important}
.seat.fixed-s{border:2px solid #a78bfa}
.seat .sg{font-size:10px;margin-bottom:1px}
.seat .sn{font-weight:700;text-align:center;line-height:1.2;word-break:break-all;font-size:12px}
.seat .snum{color:#94a3b8;font-size:11px}
.info-box{background:#f0f9ff;border-radius:8px;padding:6px 12px;font-size:12px;color:#0369a1;font-weight:600;margin-bottom:10px}
.fix-panel{background:#fef9c3;border:1.5px solid #fde047;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fix-panel p{font-size:13px;font-weight:700;color:#713f12;margin-bottom:8px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#64748b;margin-top:12px}
.legend span{padding:2px 8px;border-radius:6px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:99px;font-size:14px;font-weight:700;color:#fff;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:fadeInDown .25s ease;pointer-events:none}
@keyframes fadeInDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.history-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:12px}
.badge{font-size:11px;font-weight:700;color:#0ea5e9;background:#e0f2fe;padding:2px 8px;border-radius:99px;margin-right:6px}
.hint{font-size:12px;color:#64748b;padding:4px 0;min-height:20px}
.stat-chip{background:#f0f9ff;padding:4px 12px;border-radius:99px;color:#0369a1;font-weight:600;border:1px solid #bae6fd;font-size:12px}
.gender-toggle{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:99px;border:1.5px solid #e2e8f0;background:#f8fafc;user-select:none;transition:all .2s}
.gender-toggle.on{border-color:#6366f1;background:#eef2ff;color:#6366f1;font-weight:600}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#6366f1}
.edit-input{width:72px;font-size:13px;border:none;border-bottom:1.5px solid #0ea5e9;outline:none;background:transparent;font-family:inherit;padding:0 2px}
.import-tab-btn{flex:1;padding:8px 4px;border:none;background:#fff;color:#64748b;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;border-right:1.5px solid #e2e8f0}
.import-tab-btn:last-child{border-right:none}
.import-tab-btn.active{background:#eef2ff;color:#6366f1;font-weight:700}
.import-tab-btn:hover:not(.active){background:#f8fafc}
.seat.zone-m{background:#dbeafe;border-color:#93c5fd}
.seat.zone-f{background:#fce7f3;border-color:#f9a8d4}
.seat.zone-m.occupied{background:#bfdbfe !important}
.seat.zone-f.occupied{background:#fbcfe8 !important}
.mode-btn.active.zone-m-btn{border-color:#3b82f6;background:#eff6ff;color:#3b82f6}
.mode-btn.active.zone-f-btn{border-color:#ec4899;background:#fdf2f8;color:#ec4899}

/* ===== SHUFFLE ANIMATION ===== */
@keyframes seatSpin {
  0%   { transform: scale(1) rotate(0deg);   opacity:1; }
  30%  { transform: scale(1.15) rotate(-8deg); opacity:.7; }
  60%  { transform: scale(.85) rotate(12deg);  opacity:.5; }
  80%  { transform: scale(1.1) rotate(-4deg);  opacity:.8; }
  100% { transform: scale(1) rotate(0deg);   opacity:1; }
}
@keyframes seatFlyIn {
  0%   { transform: translateY(-30px) scale(.7); opacity:0; }
  60%  { transform: translateY(4px) scale(1.08); opacity:1; }
  100% { transform: translateY(0) scale(1);      opacity:1; }
}
@keyframes seatReveal {
  0%   { transform: rotateY(90deg) scale(.8); opacity:0; }
  100% { transform: rotateY(0deg)  scale(1);  opacity:1; }
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg);   opacity:1; }
  100% { transform: translateY(110vh) rotate(720deg);  opacity:0; }
}
@keyframes drumRoll {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}
.seat.shuffle-spin   { animation: seatSpin   .45s ease both; }
.seat.fly-in         { animation: seatFlyIn  .38s cubic-bezier(.22,1,.36,1) both; }
.seat.reveal         { animation: seatReveal .35s ease both; }
.confetti-piece {
  position:fixed; top:-20px; width:10px; height:10px;
  border-radius:2px; z-index:9998; pointer-events:none;
  animation: confettiFall linear forwards;
}
#shuffle-overlay {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(15,23,42,.72); align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
}
#shuffle-overlay.active { display:flex; }
#shuffle-title {
  font-size:28px; font-weight:800; color:#fff; letter-spacing:1px;
  text-shadow:0 2px 16px rgba(99,102,241,.8);
  animation: drumRoll .4s ease infinite;
}
#shuffle-grid-wrap {
  display:grid; gap:6px; padding:16px;
  background:rgba(255,255,255,.08); border-radius:16px;
  backdrop-filter:blur(6px); max-width:90vw; max-height:70vh; overflow:hidden;
}
.mini-seat {
  border-radius:6px; min-height:36px; min-width:36px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; line-height:1.2; padding:3px 2px;
  border:1.5px solid rgba(255,255,255,.2); color:#fff; overflow:hidden;
  word-break:break-all; text-align:center;
}
</style>
</head>
<body>

<div class="header">
  <h1>🪑 席替えアプリ</h1>
  <p>生徒情報・レイアウトを保存して、かんたん席替え</p>
</div>

<!-- SHUFFLE OVERLAY -->
<div id="shuffle-overlay">
  <div id="shuffle-title">🎲 席替え中…</div>
  <div id="shuffle-grid-wrap"></div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('setup')">⚙️ 設定</button>
  <button class="tab-btn" onclick="switchTab('seat')">🪑 席替え</button>
  <button class="tab-btn" onclick="switchTab('history')">📋 履歴</button>
</div>

<div class="content">

  <!-- SETUP -->
  <div id="panel-setup" class="panel active">

    <div class="card">
      <h2 id="students-title">👥 生徒管理</h2>

      <div style="display:flex;gap:0;margin-bottom:14px;border:1.5px solid #e2e8f0;border-radius:10px;overflow:hidden">
        <button id="import-tab-single" class="import-tab-btn active" onclick="setImportTab('single')">✏️ 1人ずつ</button>
        <button id="import-tab-paste"  class="import-tab-btn"        onclick="setImportTab('paste')">📋 貼り付け</button>
        <button id="import-tab-excel"  class="import-tab-btn"        onclick="setImportTab('excel')">📊 Excel</button>
      </div>

      <div id="import-single">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input type="text" id="new-name" placeholder="生徒名（例：田中 太郎）" style="flex:1;min-width:120px" onkeydown="if(event.key==='Enter')addStudent()">
          <select id="new-gender"><option value="male">&#9794; 男</option><option value="female">&#9792; 女</option></select>
          <button class="btn btn-primary" onclick="addStudent()">追加</button>
        </div>
      </div>

      <div id="import-paste" style="display:none">
        <div style="background:#f0f9ff;border-radius:8px;padding:8px 12px;font-size:12px;color:#0369a1;margin-bottom:8px;line-height:1.9">
          1行1人で貼り付けてください。<br>
          名前のみ → <code style="background:#dbeafe;padding:1px 5px;border-radius:4px">田中 太郎</code><br>
          名前＋性別 → <code style="background:#dbeafe;padding:1px 5px;border-radius:4px">田中 太郎 男</code> / <code style="background:#dbeafe;padding:1px 5px;border-radius:4px">佐藤 花子 女</code><br>
          ※最後のひとことが「男」「女」のときだけ性別として認識します
        </div>
        <textarea id="paste-area" placeholder="田中 太郎 男&#10;佐藤 花子 女&#10;鈴木 一郎" style="width:100%;height:110px;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.7"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
          <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer">
            <input type="checkbox" id="paste-replace" style="width:13px;height:13px"> 既存を上書き
          </label>
          <div style="flex:1"></div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px" onclick="document.getElementById('paste-area').value=''">クリア</button>
          <button class="btn btn-primary" style="padding:6px 14px;font-size:13px" onclick="importFromPaste()">👀 確認して読み込む</button>
        </div>
        <div id="paste-preview" style="display:none;margin-top:10px"></div>
      </div>

      <div id="import-excel" style="display:none">
        <div style="background:#f0fdf4;border-radius:8px;padding:8px 12px;font-size:12px;color:#166534;margin-bottom:8px;line-height:1.8">
          A列＝名前、B列＝性別（男/女）。ヘッダー行は自動スキップ。
        </div>
        <label id="excel-drop-zone" style="display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #86efac;border-radius:12px;padding:24px 16px;cursor:pointer;background:#f0fdf4;transition:all .2s;gap:4px">
          <span style="font-size:26px">&#128194;</span>
          <span style="font-size:13px;font-weight:700;color:#166534">クリックまたはドラッグ＆ドロップ</span>
          <span style="font-size:11px;color:#4ade80">.xlsx / .xls / .csv</span>
          <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleExcelFile(this.files[0])">
        </label>
        <div id="excel-preview" style="display:none;margin-top:10px"></div>
      </div>

      <div class="student-tags" id="student-tags" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2>&#128208; レイアウト設定</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
        <label style="font-size:14px;display:flex;align-items:center;gap:8px">行数: <input type="number" id="rows" min="1" max="12" value="5" style="width:58px" oninput="onLayoutChange()"></label>
        <label style="font-size:14px;display:flex;align-items:center;gap:8px">列数: <input type="number" id="cols" min="1" max="12" value="6" style="width:58px" oninput="onLayoutChange()"></label>
        <span id="seat-stats" class="stat-chip"></span>
      </div>
      <div class="mode-btns">
        <button class="mode-btn active" id="mode-view"    onclick="setMode('view')">&#128065; 表示</button>
        <button class="mode-btn"        id="mode-disable" onclick="setMode('disable')">&#128683; 席を無効化</button>
        <button class="mode-btn"        id="mode-zonem"   onclick="setMode('zonem')" style="color:#3b82f6">♂ 男子専用席</button>
        <button class="mode-btn"        id="mode-zonef"   onclick="setMode('zonef')" style="color:#ec4899">♀ 女子専用席</button>
        <button class="mode-btn"        id="mode-fix"     onclick="setMode('fix')">&#128204; 固定席を設定</button>
      </div>
      <div id="mode-hint" class="hint"></div>
      <div id="fix-panel" class="fix-panel" style="display:none"></div>
      <div class="seat-grid" id="layout-grid"></div>
    </div>

    <div class="card">
      <h2>↔️ 離席ルール設定</h2>
      <p style="font-size:12px;color:#64748b;margin-bottom:12px">「AさんとBさんを○マス以上離す」というルールを設定できます。<br>距離は縦・横・斜めを含むマス数（チェス的な距離）で計算します。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <select id="rule-s1" style="flex:1;min-width:90px;font-size:13px;padding:7px 10px">
          <option value="">生徒Aを選ぶ</option>
        </select>
        <span style="font-size:13px;color:#64748b;white-space:nowrap">と</span>
        <select id="rule-s2" style="flex:1;min-width:90px;font-size:13px;padding:7px 10px">
          <option value="">生徒Bを選ぶ</option>
        </select>
        <span style="font-size:13px;color:#64748b;white-space:nowrap">を</span>
        <input type="number" id="rule-dist" min="1" max="20" value="2" style="width:56px;font-size:13px;padding:7px 8px">
        <span style="font-size:13px;color:#64748b;white-space:nowrap">マス以上離す</span>
        <button class="btn btn-primary" style="padding:7px 14px;font-size:13px;white-space:nowrap" onclick="addSepRule()">追加</button>
      </div>
      <div id="sep-rules-list"></div>
    </div>

    <div class="card">
      <h2>&#127922; 席替えオプション</h2>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-bottom:16px">
        <input type="checkbox" id="sep-gender"> 男女を分けて配置する（男子→女子の順）
      </label>
      <button class="btn btn-primary btn-big" id="do-seat-btn" onclick="doSeating()">&#127922; 席替えする！</button>
    </div>
  </div>

  <!-- SEAT -->
  <div id="panel-seat" class="panel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <h2 style="margin:0">&#129681; 現在の席順</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label id="gender-toggle" class="gender-toggle" onclick="toggleGenderColor()">
            <input type="checkbox" id="gender-color-cb" style="pointer-events:none"> 男女カラー
          </label>
          <button class="btn btn-primary" style="padding:6px 16px;font-size:13px;border-radius:99px" onclick="doSeating()">&#127922; 再席替え</button>
        </div>
      </div>
      <div id="seat-display"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="panel-history" class="panel">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:4px" id="history-title">&#128203; 席替え履歴</h2>
    <div id="history-list"></div>
  </div>
</div>

<script>
// ===== STATE =====
var state = {
  students: [],
  rows: 5, cols: 6,
  disabled: [],
  zoneM: [],
  zoneF: [],
  fixed: {},
  sepRules: [],   // [{id, s1id, s2id, dist}]
  current: null,
  history: [],
  mode: 'view',
  selectedSeat: null,
  genderColor: false
};

var LS_KEY = 'seating_app_v3';
var pendingImport = null;
var toastTimer = null;
var editingId = null;

// ===== STORAGE =====
function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      students: state.students,
      rows: state.rows,
      cols: state.cols,
      disabled: state.disabled,
      zoneM: state.zoneM,
      zoneF: state.zoneF,
      fixed: state.fixed,
      sepRules: state.sepRules,
      current: state.current,
      history: state.history
    }));
  } catch(e) {}
}

function load() {
  try {
    var raw = localStorage.getItem(LS_KEY)
           || localStorage.getItem('seating_app_v2')
           || localStorage.getItem('seating_app_v1');
    if (!raw) return;
    var d = JSON.parse(raw);
    state.students = d.students || [];
    state.rows     = d.rows || 5;
    state.cols     = d.cols || 6;
    state.disabled = d.disabled || [];
    state.zoneM    = d.zoneM || [];
    state.zoneF    = d.zoneF || [];
    state.fixed    = d.fixed || {};
    state.sepRules = d.sepRules || [];
    state.current  = d.current || null;
    state.history  = d.history || [];
  } catch(e) {}
}

// ===== UTILS =====
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function showToast(msg, type) {
  var ex = document.querySelector('.toast');
  if (ex) ex.remove();
  clearTimeout(toastTimer);
  var el = document.createElement('div');
  el.className = 'toast';
  el.style.background = (type === 'error') ? '#ef4444' : '#10b981';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(function() { if (el.parentNode) el.remove(); }, 3000);
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

// ===== TABS =====
function switchTab(tab) {
  var names = ['setup', 'seat', 'history'];
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    b.classList.toggle('active', names[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(function(p) {
    p.classList.remove('active');
  });
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'seat')    renderSeatDisplay();
  if (tab === 'history') renderHistory();
  if (tab === 'setup')   renderAll();
}

// ===== IMPORT TABS =====
function setImportTab(tab) {
  ['single', 'paste', 'excel'].forEach(function(t) {
    document.getElementById('import-tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('import-' + t).style.display = (t === tab) ? 'block' : 'none';
  });
}

// ===== STUDENTS =====
function addStudent() {
  var name = document.getElementById('new-name').value.trim();
  if (!name) return;
  var gender = document.getElementById('new-gender').value;
  state.students.push({ id: uid(), name: name, gender: gender });
  document.getElementById('new-name').value = '';
  save();
  renderStudents();
  showToast(name + ' を追加しました');
}

function removeStudent(id) {
  state.students = state.students.filter(function(s) { return s.id !== id; });
  Object.keys(state.fixed).forEach(function(k) {
    if (state.fixed[k] === id) delete state.fixed[k];
  });
  if (state.current) {
    state.current = state.current.map(function(sid) { return sid === id ? null : sid; });
  }
  state.sepRules = state.sepRules.filter(function(r) { return r.s1id !== id && r.s2id !== id; });
  save();
  renderStudents();
  renderSepRulesList();
}

function changeGender(id, gender) {
  state.students = state.students.map(function(s) {
    return s.id === id ? { id: s.id, name: s.name, gender: gender } : s;
  });
  var tag = document.getElementById('tag-' + id);
  if (tag) {
    tag.className = 'tag ' + gender;
    var sel = tag.querySelector('select.gender-sel');
    if (sel) sel.style.color = (gender === 'male') ? '#3b82f6' : '#ec4899';
  }
  var m = state.students.filter(function(s) { return s.gender === 'male'; }).length;
  var f = state.students.filter(function(s) { return s.gender === 'female'; }).length;
  document.getElementById('students-title').textContent =
    '&#128101; 生徒管理（' + state.students.length + '人 / 男:' + m + ' 女:' + f + '）';
  save();
}

function renderStudents() {
  var el = document.getElementById('student-tags');
  var m = state.students.filter(function(s) { return s.gender === 'male'; }).length;
  var f = state.students.filter(function(s) { return s.gender === 'female'; }).length;
  document.getElementById('students-title').textContent =
    '👥 生徒管理（' + state.students.length + '人 / 男:' + m + ' 女:' + f + '）';

  if (!state.students.length) {
    el.innerHTML = '<span style="color:#94a3b8;font-size:13px">生徒を追加してください</span>';
    updateDoBtn();
    return;
  }

  var fixedIds = Object.values(state.fixed);
  el.innerHTML = state.students.map(function(s) {
    var isFixed = fixedIds.indexOf(s.id) !== -1;
    var color   = (s.gender === 'male') ? '#3b82f6' : '#ec4899';
    return '<div class="tag ' + s.gender + '" id="tag-' + s.id + '">' +
      '<select class="gender-sel" onchange="changeGender(\'' + s.id + '\',this.value)" style="color:' + color + '">' +
        '<option value="male"'   + (s.gender === 'male'   ? ' selected' : '') + '>♂</option>' +
        '<option value="female"' + (s.gender === 'female' ? ' selected' : '') + '>♀</option>' +
      '</select>' +
      '<span id="tn-' + s.id + '" ondblclick="startEdit(\'' + s.id + '\')" style="cursor:pointer">' + s.name + '</span>' +
      (isFixed ? '<span style="font-size:10px;color:#7c3aed">📌</span>' : '') +
      '<button class="tag-remove" onclick="removeStudent(\'' + s.id + '\')">×</button>' +
    '</div>';
  }).join('');
  updateDoBtn();
}

function startEdit(id) {
  if (editingId) cancelEdit();
  editingId = id;
  var s = state.students.find(function(x) { return x.id === id; });
  if (!s) return;
  var el = document.getElementById('tn-' + id);
  if (!el) return;
  el.outerHTML = '<input class="edit-input" id="edit-' + id + '" value="' + s.name + '" ' +
    'onkeydown="if(event.key===\'Enter\')saveEdit(\'' + id + '\');if(event.key===\'Escape\')cancelEdit()" ' +
    'onblur="saveEdit(\'' + id + '\')">';
  setTimeout(function() {
    var inp = document.getElementById('edit-' + id);
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function saveEdit(id) {
  var inp = document.getElementById('edit-' + id);
  if (!inp) return;
  var val = inp.value.trim();
  if (val) {
    state.students = state.students.map(function(s) {
      return s.id === id ? { id: s.id, name: val, gender: s.gender } : s;
    });
  }
  editingId = null;
  save();
  renderStudents();
}

function cancelEdit() {
  editingId = null;
  renderStudents();
}

// ===== LAYOUT =====
function onLayoutChange() {
  var r = parseInt(document.getElementById('rows').value) || 5;
  var c = parseInt(document.getElementById('cols').value) || 6;
  state.rows = Math.max(1, Math.min(12, r));
  state.cols = Math.max(1, Math.min(12, c));
  document.getElementById('rows').value = state.rows;
  document.getElementById('cols').value = state.cols;
  var total = state.rows * state.cols;
  state.disabled = state.disabled.filter(function(i) { return i < total; });
  state.zoneM    = state.zoneM.filter(function(i) { return i < total; });
  state.zoneF    = state.zoneF.filter(function(i) { return i < total; });
  Object.keys(state.fixed).forEach(function(k) {
    if (parseInt(k) >= total) delete state.fixed[k];
  });
  save();
  renderGrid();
  updateSeatStats();
}

function updateSeatStats() {
  var total = state.rows * state.cols;
  document.getElementById('seat-stats').textContent =
    '有効席: ' + (total - state.disabled.length) + ' / 全体: ' + total;
}

// ===== MODE =====
function setMode(m) {
  state.mode = m;
  state.selectedSeat = null;
  ['view', 'disable', 'zonem', 'zonef', 'fix'].forEach(function(k) {
    var btn = document.getElementById('mode-' + k);
    if (!btn) return;
    btn.classList.toggle('active', k === m);
  });
  var hints = {
    view:    '',
    disable: '席をクリックして有効 / 無効を切り替えます',
    zonem:   '♂ クリックで「男子専用席」に設定。もう一度クリックで解除します',
    zonef:   '♀ クリックで「女子専用席」に設定。もう一度クリックで解除します',
    fix:     '固定したい席をクリックしてください'
  };
  document.getElementById('mode-hint').textContent = hints[m] || '';
  document.getElementById('fix-panel').style.display = 'none';
  renderGrid();
}

// ===== GRID =====
function renderGrid() {
  var grid = document.getElementById('layout-grid');
  grid.style.gridTemplateColumns = 'repeat(' + state.cols + ',1fr)';
  grid.innerHTML = '';
  var total = state.rows * state.cols;
  for (var i = 0; i < total; i++) {
    grid.appendChild(makeSeatEl(i));
  }
}

function makeSeatEl(idx) {
  var isDisabled  = state.disabled.indexOf(idx) !== -1;
  var isZoneM     = state.zoneM.indexOf(idx) !== -1;
  var isZoneF     = state.zoneF.indexOf(idx) !== -1;
  var fixedId     = state.fixed[idx] || null;
  var fixedS      = fixedId ? state.students.find(function(s) { return s.id === fixedId; }) : null;
  var studentId   = state.current ? (state.current[idx] || null) : null;
  var student     = studentId ? state.students.find(function(s) { return s.id === studentId; }) : null;
  var isSelected  = (state.selectedSeat === idx);
  var display     = student || fixedS;

  var cls = 'seat';
  if (isDisabled) cls += ' disabled';
  if (isSelected) cls += ' selected';
  if (!isDisabled && isZoneM) cls += ' zone-m';
  if (!isDisabled && isZoneF) cls += ' zone-f';
  if (fixedId && display) cls += ' fixed-s';
  if (student) {
    cls += ' occupied';
    if (state.genderColor) cls += (student.gender === 'male') ? ' cbm' : ' cbf';
  }

  var zoneLabel = '';
  if (!isDisabled && !display) {
    if (isZoneM) zoneLabel = '<span style="font-size:9px;color:#3b82f6;font-weight:700;position:absolute;top:3px;left:4px">♂専用</span>';
    if (isZoneF) zoneLabel = '<span style="font-size:9px;color:#ec4899;font-weight:700;position:absolute;top:3px;left:4px">♀専用</span>';
  }

  var inner = '';
  if (isDisabled) {
    inner = '<span style="font-size:14px;opacity:.4">✕</span>';
  } else if (display) {
    var gc = (display.gender === 'male') ? '#3b82f6' : '#ec4899';
    var gs = (display.gender === 'male') ? '♂' : '♀';
    inner = zoneLabel +
            '<span class="sg" style="color:' + gc + '">' + gs + '</span>' +
            '<span class="sn">' + display.name + '</span>' +
            (fixedId ? '<span style="position:absolute;top:2px;right:3px;font-size:9px;color:#7c3aed">📌</span>' : '');
  } else if (state.mode === 'fix') {
    inner = zoneLabel + '<span class="snum" style="color:#d97706">選択</span>';
  } else {
    inner = zoneLabel + '<span class="snum">' + (idx + 1) + '</span>';
  }

  var el = document.createElement('div');
  el.className = cls;
  el.innerHTML = inner;
  el.onclick = (function(i) { return function() { handleSeatClick(i); }; })(idx);
  return el;
}

function handleSeatClick(idx) {
  var isDisabled = state.disabled.indexOf(idx) !== -1;
  if (state.mode === 'disable') {
    if (isDisabled) {
      state.disabled = state.disabled.filter(function(d) { return d !== idx; });
    } else {
      state.disabled.push(idx);
      delete state.fixed[idx];
      state.zoneM = state.zoneM.filter(function(i) { return i !== idx; });
      state.zoneF = state.zoneF.filter(function(i) { return i !== idx; });
    }
    save(); renderGrid(); updateSeatStats();
  } else if (state.mode === 'zonem') {
    if (isDisabled) return;
    // toggle: if already zonem remove, else set zonem and clear zonef
    if (state.zoneM.indexOf(idx) !== -1) {
      state.zoneM = state.zoneM.filter(function(i) { return i !== idx; });
    } else {
      state.zoneM.push(idx);
      state.zoneF = state.zoneF.filter(function(i) { return i !== idx; });
    }
    save(); renderGrid();
  } else if (state.mode === 'zonef') {
    if (isDisabled) return;
    if (state.zoneF.indexOf(idx) !== -1) {
      state.zoneF = state.zoneF.filter(function(i) { return i !== idx; });
    } else {
      state.zoneF.push(idx);
      state.zoneM = state.zoneM.filter(function(i) { return i !== idx; });
    }
    save(); renderGrid();
  } else if (state.mode === 'fix') {
    if (isDisabled) return;
    state.selectedSeat = idx;
    renderGrid();
    renderFixPanel(idx);
  }
}

function renderFixPanel(idx) {
  var fp = document.getElementById('fix-panel');
  fp.style.display = 'block';
  var html = '<p>席 ' + (idx + 1) + ' に固定する生徒を選んでください</p>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
    '<button onclick="assignFixed(null)" style="padding:4px 12px;border-radius:99px;border:1.5px solid #e2e8f0;background:#fff;font-size:12px;cursor:pointer;color:#ef4444;font-family:inherit">固定解除</button>';
  state.students.forEach(function(s) {
    var bc = (s.gender === 'male') ? '#bfdbfe' : '#fbcfe8';
    var bg = (s.gender === 'male') ? '#eff6ff' : '#fdf2f8';
    var gs = (s.gender === 'male') ? '♂' : '♀';
    html += '<button onclick="assignFixed(\'' + s.id + '\')" ' +
      'style="padding:4px 12px;border-radius:99px;border:1.5px solid ' + bc + ';background:' + bg + ';font-size:12px;cursor:pointer;font-weight:600;font-family:inherit">' +
      gs + ' ' + s.name + '</button>';
  });
  html += '</div>';
  fp.innerHTML = html;
}

function assignFixed(studentId) {
  var idx = state.selectedSeat;
  if (idx === null) return;
  if (studentId) {
    Object.keys(state.fixed).forEach(function(k) {
      if (state.fixed[k] === studentId) delete state.fixed[k];
    });
  }
  if (studentId === null) delete state.fixed[idx];
  else state.fixed[idx] = studentId;
  state.selectedSeat = null;
  document.getElementById('fix-panel').style.display = 'none';
  save(); renderGrid(); renderStudents();
  showToast('固定席を設定しました');
}

// ===== SEATING =====
// チェビシェフ距離（縦・横・斜めを含む最大差）
function seatDist(idxA, idxB) {
  var rA = Math.floor(idxA / state.cols), cA = idxA % state.cols;
  var rB = Math.floor(idxB / state.cols), cB = idxB % state.cols;
  return Math.max(Math.abs(rA - rB), Math.abs(cA - cB));
}

function checkSepRules(seating) {
  for (var i = 0; i < state.sepRules.length; i++) {
    var r = state.sepRules[i];
    var posA = seating.indexOf(r.s1id);
    var posB = seating.indexOf(r.s2id);
    if (posA === -1 || posB === -1) continue;
    if (seatDist(posA, posB) < r.dist) return false;
  }
  return true;
}

function doSeating() {
  var total = state.rows * state.cols;
  var activeIdx = [];
  for (var i = 0; i < total; i++) {
    if (state.disabled.indexOf(i) === -1) activeIdx.push(i);
  }

  var fixedVals    = Object.values(state.fixed);
  var freeStudents = state.students.filter(function(s) { return fixedVals.indexOf(s.id) === -1; });
  var freeSeatIdx  = activeIdx.filter(function(i) { return !state.fixed[i]; });

  var mSeats = freeSeatIdx.filter(function(i) { return state.zoneM.indexOf(i) !== -1; });
  var fSeats = freeSeatIdx.filter(function(i) { return state.zoneF.indexOf(i) !== -1; });
  var nSeats = freeSeatIdx.filter(function(i) { return state.zoneM.indexOf(i) === -1 && state.zoneF.indexOf(i) === -1; });

  var males   = freeStudents.filter(function(s) { return s.gender === 'male'; });
  var females = freeStudents.filter(function(s) { return s.gender === 'female'; });

  if (males.length < mSeats.length) {
    showToast('男子専用席(' + mSeats.length + '席)が男子の人数(' + males.length + '人)を超えています', 'error'); return;
  }
  if (females.length < fSeats.length) {
    showToast('女子専用席(' + fSeats.length + '席)が女子の人数(' + females.length + '人)を超えています', 'error'); return;
  }
  if (freeStudents.length > freeSeatIdx.length) {
    showToast('生徒数が空き席数より多いです', 'error'); return;
  }

  function tryArrange() {
    var mCopy = males.slice(), fCopy = females.slice();
    var mS = mSeats.slice(), fS = fSeats.slice(), nS = nSeats.slice();
    shuffle(mCopy); shuffle(fCopy); shuffle(mS); shuffle(fS); shuffle(nS);

    var s = [];
    for (var j = 0; j < total; j++) s.push(null);
    Object.keys(state.fixed).forEach(function(k) { s[parseInt(k)] = state.fixed[k]; });

    var mLeft = mCopy.slice();
    mS.forEach(function(seat) { s[seat] = mLeft.shift().id; });

    var fLeft = fCopy.slice();
    fS.forEach(function(seat) { s[seat] = fLeft.shift().id; });

    var remaining = mLeft.concat(fLeft);
    if (document.getElementById('sep-gender').checked) {
      shuffle(mLeft); shuffle(fLeft); remaining = mLeft.concat(fLeft);
    } else { shuffle(remaining); }
    nS.forEach(function(seat) { if (remaining.length) s[seat] = remaining.shift().id; });

    return s;
  }

  var seating = null;
  var MAX_TRY = 500;
  for (var t = 0; t < MAX_TRY; t++) {
    var candidate = tryArrange();
    if (checkSepRules(candidate)) { seating = candidate; break; }
  }

  if (!seating) {
    // 離席ルールを満たす配置が見つからなかった場合、ベスト案で実行
    var bestViolations = Infinity;
    var bestCandidate = null;
    for (var t2 = 0; t2 < 100; t2++) {
      var c2 = tryArrange();
      var violations = state.sepRules.reduce(function(acc, r) {
        var pA = c2.indexOf(r.s1id), pB = c2.indexOf(r.s2id);
        if (pA === -1 || pB === -1) return acc;
        return acc + (seatDist(pA, pB) < r.dist ? 1 : 0);
      }, 0);
      if (violations < bestViolations) { bestViolations = violations; bestCandidate = c2; }
    }
    seating = bestCandidate;
    showToast('⚠️ 離席ルールを完全には満たせませんでした（' + bestViolations + '件未達成）', 'error');
  }

  state.current = seating;
  state.history = [{
    id: uid(),
    date: new Date().toLocaleString('ja-JP'),
    seating: seating.slice(),
    rows: state.rows,
    cols: state.cols,
    disabled: state.disabled.slice(),
    zoneM: state.zoneM.slice(),
    zoneF: state.zoneF.slice()
  }].concat(state.history).slice(0, 20);

  save();
  playShuffleAnimation(seating, function() {
    renderGrid();
    switchTab('seat');
    renderSeatDisplay();
    launchConfetti();
    showToast('席替えが完了しました！🎉');
  });
}

// ===== SOUND & ANIMATION =====
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playWhoosh() {
  try {
    var ctx = getAudioCtx();
    var buf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) {
      var t = i / ctx.sampleRate;
      var env = Math.pow(1 - t / 0.6, 2.5);
      // noise swept with frequency rise
      data[i] = (Math.random() * 2 - 1) * env * 0.6
              + Math.sin(2 * Math.PI * (200 + t * 1800) * t) * env * 0.3;
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.7, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    src.connect(gain); gain.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

function playDrumRoll(duration, onDone) {
  try {
    var ctx = getAudioCtx();
    var interval = 0.04;
    var count = Math.floor(duration / interval);
    for (var n = 0; n < count; n++) {
      (function(idx) {
        setTimeout(function() {
          try {
            var buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < d.length; i++) {
              var t2 = i / ctx.sampleRate;
              d[i] = (Math.random() * 2 - 1) * Math.exp(-t2 * 60) * 0.5;
            }
            var s2 = ctx.createBufferSource();
            s2.buffer = buf;
            var g2 = ctx.createGain();
            var vol = 0.2 + (idx / count) * 0.5;
            g2.gain.setValueAtTime(vol, ctx.currentTime);
            s2.connect(g2); g2.connect(ctx.destination);
            s2.start();
          } catch(e) {}
        }, idx * interval * 1000);
      })(n);
    }
    setTimeout(onDone, duration * 1000);
  } catch(e) { onDone(); }
}

function playFanfare() {
  try {
    var ctx = getAudioCtx();
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var t = ctx.currentTime + i * 0.1;
      osc.frequency.setValueAtTime(freq, t);
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.4);
    });
  } catch(e) {}
}

function launchConfetti() {
  var colors = ['#f59e0b','#3b82f6','#10b981','#ec4899','#6366f1','#ef4444','#a78bfa'];
  for (var i = 0; i < 60; i++) {
    (function(idx) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width  = (8 + Math.random() * 10) + 'px';
        el.style.height = (8 + Math.random() * 10) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        var dur = 1.2 + Math.random() * 1.5;
        el.style.animationDuration = dur + 's';
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, dur * 1000 + 100);
      }, idx * 30);
    })(i);
  }
}

// Animated mini-grid shown during shuffle
function playShuffleAnimation(finalSeating, onDone) {
  var overlay  = document.getElementById('shuffle-overlay');
  var gridWrap = document.getElementById('shuffle-grid-wrap');
  var title    = document.getElementById('shuffle-title');

  // Build random-shuffle frames
  var names = state.students.map(function(s) { return s.name; });
  var FRAMES = 14;
  var FRAME_MS = 120;

  gridWrap.style.gridTemplateColumns = 'repeat(' + state.cols + ', 1fr)';
  overlay.classList.add('active');

  playDrumRoll((FRAMES * FRAME_MS) / 1000, function() {});

  var frame = 0;
  function renderFrame(seating) {
    gridWrap.innerHTML = '';
    var total = state.rows * state.cols;
    for (var i = 0; i < total; i++) {
      var el = document.createElement('div');
      el.className = 'mini-seat';
      var isDisabled = state.disabled.indexOf(i) !== -1;
      if (isDisabled) {
        el.style.background = 'rgba(100,116,139,.2)';
        el.innerHTML = '<span style="opacity:.3">✕</span>';
      } else if (seating[i]) {
        var s = state.students.find(function(x) { return x.id === seating[i]; });
        if (s) {
          el.style.background = s.gender === 'male' ? 'rgba(59,130,246,.55)' : 'rgba(236,72,153,.5)';
          el.innerHTML = (s.gender === 'male' ? '♂' : '♀') + '<br>' + s.name;
        }
      } else {
        el.style.background = 'rgba(255,255,255,.1)';
      }
      el.style.animation = 'seatSpin ' + (.2 + Math.random() * .25) + 's ease both';
      el.style.animationDelay = (Math.random() * 0.08) + 's';
      gridWrap.appendChild(el);
    }
  }

  function scramble() {
    // random seating for visual
    var tmp = state.students.slice();
    shuffle(tmp);
    var s = [];
    for (var i = 0; i < state.rows * state.cols; i++) s.push(null);
    var idx2 = 0;
    for (var i = 0; i < s.length; i++) {
      if (state.disabled.indexOf(i) === -1 && idx2 < tmp.length) s[i] = tmp[idx2++].id;
    }
    return s;
  }

  var iv = setInterval(function() {
    frame++;
    playWhoosh();
    if (frame >= FRAMES) {
      clearInterval(iv);
      title.textContent = '✨ 決定！';
      renderFrame(finalSeating);
      playFanfare();
      // reveal each cell with fly-in
      var cells = gridWrap.querySelectorAll('.mini-seat');
      cells.forEach(function(c, i) {
        c.style.animation = 'seatFlyIn .35s cubic-bezier(.22,1,.36,1) both';
        c.style.animationDelay = (i * 18) + 'ms';
      });
      setTimeout(function() {
        overlay.classList.remove('active');
        onDone();
      }, 900 + cells.length * 14);
    } else {
      title.textContent = frame < FRAMES - 2 ? '🎲 席替え中…' : '⏳ もうすぐ！';
      renderFrame(scramble());
    }
  }, FRAME_MS);
}

// ===== SEAT DISPLAY =====
function toggleGenderColor() {
  state.genderColor = !state.genderColor;
  document.getElementById('gender-color-cb').checked = state.genderColor;
  document.getElementById('gender-toggle').classList.toggle('on', state.genderColor);
  renderSeatDisplay(); renderGrid();
}

function renderSeatDisplay() {
  var el = document.getElementById('seat-display');
  if (!state.current) {
    el.innerHTML = '<div style="text-align:center;padding:48px 0;color:#94a3b8;font-size:14px">' +
      '<div style="font-size:40px;margin-bottom:8px">🪑</div>' +
      'まだ席替えが行われていません<br>「設定」タブで席替えを実行してください</div>';
    return;
  }
  el.innerHTML = '<div class="info-box">⬆️ 黒板側</div>' +
    buildGridHTML(state.current, state.rows, state.cols, state.disabled, false) +
    '<div class="legend">' +
    '<span style="background:#eff6ff;border:1px solid #bfdbfe">♂ 男子</span>' +
    '<span style="background:#fdf2f8;border:1px solid #fbcfe8">♀ 女子</span>' +
    '<span style="background:#dbeafe;border:1px solid #93c5fd">♂ 男子専用席</span>' +
    '<span style="background:#fce7f3;border:1px solid #f9a8d4">♀ 女子専用席</span>' +
    '<span style="border:2px solid #a78bfa">📌 固定席</span>' +
    '</div>';
  // staggered fly-in for each seat cell
  el.querySelectorAll('.seat').forEach(function(cell, i) {
    cell.classList.add('fly-in');
    cell.style.animationDelay = (i * 20) + 'ms';
  });

function buildGridHTML(seating, rows, cols, disabled, small) {
  var total = rows * cols;
  var gap = small ? 4 : 6;
  var html = '<div class="seat-grid" style="grid-template-columns:repeat(' + cols + ',1fr);gap:' + gap + 'px">';
  for (var i = 0; i < total; i++) {
    var isDisabled = disabled.indexOf(i) !== -1;
    var studentId  = seating ? (seating[i] || null) : null;
    var student    = studentId ? state.students.find(function(s) { return s.id === studentId; }) : null;
    var cls = 'seat' + (isDisabled ? ' disabled' : '') +
              (student ? ' occupied' + (state.genderColor ? (student.gender === 'male' ? ' cbm' : ' cbf') : '') : '');
    var inner = '';
    if (isDisabled) {
      inner = '<span style="font-size:' + (small ? 10 : 14) + 'px;opacity:.4">✕</span>';
    } else if (student) {
      var gc = (student.gender === 'male') ? '#3b82f6' : '#ec4899';
      var gs = (student.gender === 'male') ? '♂' : '♀';
      inner = '<span class="sg" style="color:' + gc + ';font-size:' + (small ? 9 : 10) + 'px">' + gs + '</span>' +
              '<span class="sn" style="font-size:' + (small ? 9 : 12) + 'px">' + student.name + '</span>';
    } else {
      inner = '<span class="snum" style="font-size:' + (small ? 9 : 11) + 'px">' + (i + 1) + '</span>';
    }
    html += '<div class="' + cls + '" style="min-height:' + (small ? 28 : 52) + 'px;border-radius:' + (small ? 5 : 8) + 'px;cursor:default">' + inner + '</div>';
  }
  return html + '</div>';
}

// ===== HISTORY =====

  if (!state.history.length) {

  }

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">' +
        '<div><span class="badge">#' + (state.history.length - i) + '</span>' +
        '<span style="font-size:13px;color:#64748b">' + r.date + '</span></div>' +
        '<button class="btn btn-outline" style="padding:5px 14px;font-size:12px;border-radius:99px;color:#0ea5e9;border-color:#0ea5e9" ' +
          'onclick="restoreHistory(\'' + r.id + '\')">この席順に戻す</button>' +

function restoreHistory(id) {
  var r = state.history.find(function(h) { return h.id === id; });
  if (!r) return;
  state.current  = r.seating;
  state.rows     = r.rows;
  state.cols     = r.cols;
  state.disabled = r.disabled || [];
  document.getElementById('rows').value = r.rows;
  document.getElementById('cols').value = r.cols;
  save(); switchTab('seat');
  showToast('履歴から復元しました');
}

// ===== MISC =====
function updateDoBtn() {
  document.getElementById('do-seat-btn').disabled = (state.students.length === 0);
}

// ===== SEP RULES =====
function renderSepRuleSelects() {
  ['rule-s1', 'rule-s2'].forEach(function(id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = '<option value="">' + (id === 'rule-s1' ? '生徒Aを選ぶ' : '生徒Bを選ぶ') + '</option>';
    state.students.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = (s.gender === 'male' ? '♂' : '♀') + ' ' + s.name;
      if (s.id === cur) opt.selected = true;
      sel.appendChild(opt);
    });
  });
}

function addSepRule() {
  var s1id = document.getElementById('rule-s1').value;
  var s2id = document.getElementById('rule-s2').value;
  var dist = parseInt(document.getElementById('rule-dist').value) || 2;
  if (!s1id || !s2id) { showToast('生徒AとBを両方選んでください', 'error'); return; }
  if (s1id === s2id)  { showToast('同じ生徒は選べません', 'error'); return; }
  // avoid duplicate pair
  var exists = state.sepRules.some(function(r) {
    return (r.s1id === s1id && r.s2id === s2id) || (r.s1id === s2id && r.s2id === s1id);
  });
  if (exists) { showToast('同じペアのルールがすでにあります', 'error'); return; }
  state.sepRules.push({ id: uid(), s1id: s1id, s2id: s2id, dist: Math.max(1, Math.min(20, dist)) });
  save();
  renderSepRulesList();
  showToast('離席ルールを追加しました');
}

function removeSepRule(id) {
  state.sepRules = state.sepRules.filter(function(r) { return r.id !== id; });
  save();
  renderSepRulesList();
}

function renderSepRulesList() {
  var el = document.getElementById('sep-rules-list');
  if (!el) return;
  renderSepRuleSelects();
  if (!state.sepRules.length) {
    el.innerHTML = '<p style="font-size:12px;color:#94a3b8;text-align:center;padding:8px 0">ルールがまだ設定されていません</p>';
    return;
  }
  el.innerHTML = state.sepRules.map(function(r) {
    var sA = state.students.find(function(s) { return s.id === r.s1id; });
    var sB = state.students.find(function(s) { return s.id === r.s2id; });
    if (!sA || !sB) return '';
    var nameA = (sA.gender === 'male' ? '♂' : '♀') + ' ' + sA.name;
    var nameB = (sB.gender === 'male' ? '♂' : '♀') + ' ' + sB.name;
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:6px;flex-wrap:wrap">' +
      '<span style="font-size:12px;font-weight:700;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:2px 8px;white-space:nowrap">' + nameA + '</span>' +
      '<span style="font-size:11px;color:#64748b">と</span>' +
      '<span style="font-size:12px;font-weight:700;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:2px 8px;white-space:nowrap">' + nameB + '</span>' +
      '<span style="font-size:11px;color:#64748b">を</span>' +
      '<span style="font-size:13px;font-weight:800;color:#6366f1">' + r.dist + '</span>' +
      '<span style="font-size:11px;color:#64748b">マス以上離す</span>' +
      '<div style="flex:1"></div>' +
      '<button onclick="removeSepRule(\'' + r.id + '\')" style="border:none;background:none;cursor:pointer;color:#94a3b8;font-size:18px;line-height:1;padding:0" title="削除">×</button>' +
    '</div>';
  }).join('');
}



function renderAll() {
  document.getElementById('rows').value = state.rows;

// ===== IMPORT: PARSE HELPERS =====
function isGenderKw(s) {
  var t = (s || '').trim().toLowerCase();
  return ['男','女','m','f','male','female','boy','girl','♂','♀'].indexOf(t) !== -1;
}
function parseGender(str) {
  var s = (str || '').trim().toLowerCase();
  return (s === '女' || s === 'f' || s === 'female' || s === 'girl' || s === '♀') ? 'female' : 'male';
}
// 最後トークンが性別キーワードのときのみ性別として扱い、残りをすべて名前にする
function parseLine(line) {
  var parts;
  if (line.indexOf('\t') !== -1) {
    parts = line.split('\t');
  } else if (line.indexOf(',') !== -1) {
    parts = line.split(',');
  } else {
    parts = line.split(/[\s\u3000]+/);
  }
  parts = parts.map(function(p) { return p.trim(); }).filter(function(p) { return p.length > 0; });
  if (!parts.length) return null;
  var last = parts[parts.length - 1];
  if (parts.length >= 2 && isGenderKw(last)) {
    return { name: parts.slice(0, parts.length - 1).join(' '), gender: parseGender(last) };
  }
  return { name: parts.join(' '), gender: 'male' };
}

// ===== IMPORT: PASTE =====
function importFromPaste() {
  var raw = document.getElementById('paste-area').value.trim();
  if (!raw) { showToast('テキストを入力してください', 'error'); return; }
  var parsed = raw.split(/\r?\n/)
    .map(function(l) { return l.trim(); })
    .filter(function(l) { return l.length > 0; })
    .map(parseLine)
    .filter(function(p) { return p && p.name; });
  if (!parsed.length) { showToast('有効な名前が見つかりませんでした', 'error'); return; }
  showImportPreview(parsed, 'paste');
}

// ===== IMPORT: PREVIEW =====
function showImportPreview(parsed, source) {
  pendingImport = parsed;
  var container = document.getElementById(source === 'paste' ? 'paste-preview' : 'excel-preview');
  var m = parsed.filter(function(p) { return p.gender === 'male'; }).length;
  var f = parsed.filter(function(p) { return p.gender === 'female'; }).length;

  var rowsHtml = parsed.map(function(p, i) {
    var bg  = (p.gender === 'male') ? '#eff6ff' : '#fdf2f8';
    var bc  = (p.gender === 'male') ? '#bfdbfe' : '#fbcfe8';
    var sbg = (p.gender === 'male') ? '#dbeafe' : '#fce7f3';
    var sc  = (p.gender === 'male') ? '#1d4ed8' : '#be185d';
    return '<div id="prow-' + source + '-' + i + '" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:' + bg + '">' +
      '<span style="font-size:13px;font-weight:600;flex:1;min-width:0;word-break:break-all">' + p.name + '</span>' +
      '<select onchange="updatePendingGender(' + i + ',\'' + source + '\',this.value)" ' +
        'style="font-size:12px;padding:3px 8px;border:1.5px solid ' + bc + ';border-radius:6px;background:' + sbg + ';cursor:pointer;font-family:inherit;color:' + sc + '">' +
        '<option value="male"'   + (p.gender === 'male'   ? ' selected' : '') + '>♂ 男</option>' +
        '<option value="female"' + (p.gender === 'female' ? ' selected' : '') + '>♀ 女</option>' +
      '</select>' +
    '</div>';
  }).join('');

  container.style.display = 'block';
  container.innerHTML =
    '<div style="background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:12px;padding:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">' +
        '<span id="pcount-' + source + '" style="font-size:13px;font-weight:700;color:#0369a1">' +
          parsed.length + '人を検出（男:' + m + ' 女:' + f + '）<br>' +
          '<span style="font-size:11px;font-weight:400;color:#64748b">性別をドロップダウンで変更できます</span>' +
        '</span>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer">' +
            '<input type="checkbox" id="' + source + '-replace" style="width:13px;height:13px"> 上書き' +
          '</label>' +
          '<button class="btn btn-primary" style="padding:5px 14px;font-size:12px;border-radius:8px" ' +
            'onclick="confirmImport(\'' + source + '\')">✅ 読み込む</button>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto">' +
        rowsHtml +
      '</div>' +
    '</div>';
}

function updatePendingGender(idx, source, gender) {
  if (!pendingImport || !pendingImport[idx]) return;
  pendingImport[idx].gender = gender;
  var row = document.getElementById('prow-' + source + '-' + idx);
  if (row) {
    row.style.background = (gender === 'male') ? '#eff6ff' : '#fdf2f8';
    var sel = row.querySelector('select');
    if (sel) {
      sel.style.borderColor = (gender === 'male') ? '#bfdbfe' : '#fbcfe8';
      sel.style.background  = (gender === 'male') ? '#dbeafe' : '#fce7f3';
      sel.style.color       = (gender === 'male') ? '#1d4ed8' : '#be185d';
    }
  }
  var m = pendingImport.filter(function(p) { return p.gender === 'male'; }).length;
  var f = pendingImport.filter(function(p) { return p.gender === 'female'; }).length;
  var counter = document.getElementById('pcount-' + source);
  if (counter) counter.innerHTML = pendingImport.length + '人を検出（男:' + m + ' 女:' + f + '）<br>' +
    '<span style="font-size:11px;font-weight:400;color:#64748b">性別をドロップダウンで変更できます</span>';
}

function confirmImport(source) {
  if (!pendingImport) return;
  var replaceEl = document.getElementById(source + '-replace');
  var replace   = replaceEl ? replaceEl.checked : false;
  var students  = pendingImport.map(function(p) {
    return { id: uid(), name: p.name, gender: p.gender };
  });

  if (replace) {
    state.students = students;
    state.fixed = {};
    state.current = null;
    showToast(students.length + '人を読み込みました');
  } else {
    var existing = {};
    state.students.forEach(function(s) { existing[s.name] = true; });
    var newOnes = students.filter(function(s) { return !existing[s.name]; });
    state.students = state.students.concat(newOnes);
    var skipped = students.length - newOnes.length;
    showToast(newOnes.length + '人を追加' + (skipped > 0 ? '（' + skipped + '人重複スキップ）' : ''));
  }

  pendingImport = null;
  if (source === 'paste') {
    document.getElementById('paste-area').value = '';
    document.getElementById('paste-preview').style.display = 'none';
  } else {
    document.getElementById('excel-preview').style.display = 'none';
    document.getElementById('excel-file-input').value = '';
  }
  save(); renderStudents();
}

// ===== IMPORT: EXCEL =====
function handleExcelFile(file) {
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    var reader = new FileReader();
    reader.onload = function(e) { parseCSVData(e.target.result, file.name); };
    reader.readAsText(file, 'UTF-8');
  } else {
    if (typeof XLSX === 'undefined') {
      var script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.onload = function() { readXLSX(file); };
      script.onerror = function() { showToast('ライブラリ読み込み失敗。CSVをお試しください', 'error'); };
      document.head.appendChild(script);
    } else {
      readXLSX(file);
    }
  }
}

function readXLSX(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      showExcelPreview(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }), file.name);
    } catch(err) { showToast('ファイル読み込み失敗', 'error'); }
  };
  reader.readAsArrayBuffer(file);
}

function parseCSVData(text, filename) {
  var rows = text.split(/\r?\n/).map(function(l) {
    return l.split(',').map(function(c) { return c.replace(/^"|"$/g, '').trim(); });
  });
  showExcelPreview(rows, filename);
}

function showExcelPreview(rows, filename) {
  var start = 0;
  var first = (rows[0] ? String(rows[0][0] || '') : '').toLowerCase();
  if (['名前','氏名','name','生徒名'].indexOf(first) !== -1) start = 1;
  var parsed = [];
  for (var i = start; i < rows.length; i++) {
    var raw  = String(rows[i][0] || '').trim();
    if (!raw) continue;
    var colB = String(rows[i][1] || '').trim();
    parsed.push({ name: raw, gender: colB ? parseGender(colB) : 'male' });
  }
  if (!parsed.length) {
    var prev = document.getElementById('excel-preview');
    prev.style.display = 'block';
    prev.innerHTML = '<div style="color:#ef4444;font-size:13px">データが見つかりませんでした</div>';
    return;
  }
  showImportPreview(parsed, 'excel');
}

// Drag & drop setup
document.addEventListener('DOMContentLoaded', function() {
  var zone = document.getElementById('excel-drop-zone');
  if (!zone) return;
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
  zone.addEventListener('drop', function(e) {
    e.preventDefault(); zone.classList.remove('dragover');
    var f = e.dataTransfer.files[0];
    if (f) handleExcelFile(f);
  });
});

// ===== INIT =====
load();
renderAll();
